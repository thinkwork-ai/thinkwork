name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish deployable platform assets for"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  RELEASE_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
  IS_CLI_RELEASE: ${{ !contains(inputs.release_tag || github.ref_name, '-canary.') }}

jobs:
  # ── Build + test ────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  # ── Build deployable release artifacts ──────────────────────────
  build-deploy-artifacts:
    name: Build deployable artifacts
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      manifest_sha256: ${{ steps.manifest_digest.outputs.sha256 }}
      # THINK-616: the customer-ECR mirror copies this exact arm64 image.
      pi_arm64_digest: ${{ steps.pi-arm64.outputs.digest }}
      pi_arm64_source_repository: ${{ steps.mirror_source_repository.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release metadata
        id: release
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${RELEASE_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "asset_base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "agentcore_repository=ghcr.io/${OWNER}/thinkwork-agentcore" >> "$GITHUB_OUTPUT"
          echo "n8n_repository=ghcr.io/${OWNER}/thinkwork-n8n" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Lambda zips
        run: |
          bash scripts/build-lambdas.sh
          mkdir -p dist/release/lambdas
          cp dist/lambdas/*.zip dist/release/lambdas/
          cp dist/lambdas/lambdas-manifest.json dist/release/lambdas/

      - name: Build static sites
        run: |
          pnpm --filter @thinkwork/web build
          pnpm --filter @thinkwork/docs build
          bash scripts/release/package-static-assets.sh dist/release/static

      - name: Stage deployment runner script
        run: |
          mkdir -p dist/release/runner
          cp terraform/modules/app/deployment-control-plane/runner.py dist/release/runner/thinkwork-runner.py

      - name: Package AgentCore control runtime
        run: bash scripts/release/package-agentcore-control-runtime.sh

      - name: Verify AgentCore control runtime under deployment Node.js
        run: bash scripts/release/verify-agentcore-control-runtime-node22.sh

      - name: Stage Twenty ThinkWork app package
        run: |
          mkdir -p dist/release/managed-apps
          tar -czf dist/release/managed-apps/twenty-thinkwork-app.tar.gz \
            plugins/twenty/twenty-app \
            plugins/twenty/scripts/sync-thinkwork-app.mjs

      - name: Bundle platform artifacts
        run: bash scripts/release/package-platform-artifacts.sh dist/release

      - uses: docker/setup-qemu-action@v3

      # Blacksmith sticky-disk builder (persistent NVMe layer cache)
      # replaces docker/setup-buildx-action + type=gha caching. The
      # arm64 Pi build still runs under QEMU here — the release job is
      # one unit because the manifest step needs all image digests —
      # but warm layer cache makes the emulated rebuild cheap.
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: release-docker

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Resolve n8n runtime repository
        id: n8n_runtime_repository
        run: |
          if [[ -n "${N8N_RUNTIME_IMAGE_REPOSITORY:-}" ]]; then
            echo "value=${N8N_RUNTIME_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${ECR_REGISTRY}/thinkwork-dev-agentcore" >> "$GITHUB_OUTPUT"
          fi
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          N8N_RUNTIME_IMAGE_REPOSITORY: ${{ vars.N8N_RUNTIME_IMAGE_REPOSITORY || '' }}

      # THINK-616: the arm64 Pi image is also pushed to the ThinkWork dev ECR so
      # the customer-ECR mirror job has an AWS-native (no GHCR token) copy source.
      # A CI-token GHCR pull previously failed with 403 (token lacked
      # read:packages), which is why the mirror reads from ECR.
      - name: Resolve arm64 mirror source repository
        id: mirror_source_repository
        run: |
          if [[ -n "${RELEASE_MIRROR_SOURCE_REPOSITORY:-}" ]]; then
            echo "value=${RELEASE_MIRROR_SOURCE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${ECR_REGISTRY}/thinkwork-dev-agentcore" >> "$GITHUB_OUTPUT"
          fi
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          RELEASE_MIRROR_SOURCE_REPOSITORY: ${{ vars.RELEASE_MIRROR_SOURCE_REPOSITORY || '' }}

      - name: Compute build timestamp
        id: build_time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push AgentCore Pi amd64
        id: pi-amd64
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: packages/agentcore-pi/agent-container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.agentcore_repository }}:${{ env.RELEASE_REF_NAME }}-pi-amd64
            ${{ steps.release.outputs.agentcore_repository }}:${{ steps.release.outputs.commit }}-pi-amd64
          build-args: |
            GIT_SHA=${{ steps.release.outputs.commit }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          provenance: false

      - name: Build and push AgentCore Pi arm64
        id: pi-arm64
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: packages/agentcore-pi/agent-container/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.agentcore_repository }}:${{ env.RELEASE_REF_NAME }}-pi-arm64
            ${{ steps.release.outputs.agentcore_repository }}:${{ steps.release.outputs.commit }}-pi-arm64
            ${{ steps.mirror_source_repository.outputs.value }}:${{ env.RELEASE_REF_NAME }}-pi-arm64
            ${{ steps.mirror_source_repository.outputs.value }}:${{ steps.release.outputs.commit }}-pi-arm64
          build-args: |
            GIT_SHA=${{ steps.release.outputs.commit }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          provenance: false

      - name: Build and push n8n runtime amd64
        id: n8n-amd64
        uses: useblacksmith/build-push-action@v2
        with:
          context: plugins/n8n/runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.n8n_repository }}:${{ env.RELEASE_REF_NAME }}-n8n-amd64
            ${{ steps.release.outputs.n8n_repository }}:${{ steps.release.outputs.commit }}-n8n-amd64
            ${{ steps.n8n_runtime_repository.outputs.value }}:${{ env.RELEASE_REF_NAME }}-n8n-amd64
            ${{ steps.n8n_runtime_repository.outputs.value }}:${{ steps.release.outputs.commit }}-n8n-amd64
          build-args: |
            N8N_BASE_IMAGE=n8nio/n8n:2.27.3@sha256:a772d24e6b4f9b3848be5a57c5e45437eed1965bbbcefa2f9a93f4835b6639fa
          provenance: false

      - name: Build release manifest
        run: |
          AGENTCORE_REPOSITORY="${{ steps.release.outputs.agentcore_repository }}"
          N8N_REPOSITORY="${{ steps.n8n_runtime_repository.outputs.value }}"
          SIGN_ARGS=()
          if [[ -n "${RELEASE_MANIFEST_PRIVATE_KEY:-}" && -n "${RELEASE_MANIFEST_KEY_ID:-}" ]]; then
            install -m 700 -d dist/release/signing
            printf '%s' "$RELEASE_MANIFEST_PRIVATE_KEY" > dist/release/signing/release-private-key.pem
            SIGN_ARGS=(
              --signing-key-id "$RELEASE_MANIFEST_KEY_ID"
              --private-key-path dist/release/signing/release-private-key.pem
              --signature-output dist/release/thinkwork-release.sig.json
              --signature-expires-at "$(date -u -d '+1 year' '+%Y-%m-%dT%H:%M:%S.000Z')"
            )
          fi
          if [[ -z "${TWENTY_IMAGE_URI:-}" ]]; then
            echo "::error::TWENTY_IMAGE_URI repository variable must be set to a pinned image URI before publishing managed-app release manifests."
            exit 1
          fi
          MANAGED_APP_IMAGE_ARGS=(
            --image "name=n8n-runtime,repository=${N8N_REPOSITORY},tag=${RELEASE_REF_NAME}-n8n-amd64,digest=${{ steps.n8n-amd64.outputs.digest }},architecture=amd64"
            --image "name=twenty,uri=${TWENTY_IMAGE_URI},architecture=amd64"
          )
          pnpm exec tsx scripts/release/build-release-manifest.ts \
            --version "${{ steps.release.outputs.version }}" \
            --commit "${{ steps.release.outputs.commit }}" \
            --artifact-root dist/release \
            --base-url "${{ steps.release.outputs.asset_base_url }}" \
            --lambda-dir dist/release/lambdas \
            --deployment-runner-script dist/release/runner/thinkwork-runner.py \
            --artifact "name=web,type=static-site,path=dist/release/static/web.tar.gz" \
            --artifact "name=docs,type=static-site,path=dist/release/static/docs.tar.gz" \
            --artifact "name=twenty-thinkwork-app,type=seed,path=dist/release/managed-apps/twenty-thinkwork-app.tar.gz" \
            --artifact-bundle "name=platform,path=dist/release/platform-artifacts.tar.gz" \
            --image "name=agentcore-pi-amd64,repository=${AGENTCORE_REPOSITORY},tag=${RELEASE_REF_NAME}-pi-amd64,digest=${{ steps.pi-amd64.outputs.digest }},architecture=amd64" \
            --image "name=agentcore-pi-arm64,repository=${AGENTCORE_REPOSITORY},tag=${RELEASE_REF_NAME}-pi-arm64,digest=${{ steps.pi-arm64.outputs.digest }},architecture=arm64" \
            "${MANAGED_APP_IMAGE_ARGS[@]}" \
            "${SIGN_ARGS[@]}"
        env:
          RELEASE_MANIFEST_KEY_ID: ${{ secrets.RELEASE_MANIFEST_KEY_ID }}
          RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY }}
          TWENTY_IMAGE_URI: ${{ vars.TWENTY_IMAGE_URI || '' }}

      - name: Compute release manifest digest
        id: manifest_digest
        run: |
          # Deployment preflight validates the exact downloaded bytes from GitHub.
          sha256="$(shasum -a 256 dist/release/thinkwork-release.json | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload deployable release assets
        uses: actions/upload-artifact@v4
        with:
          name: thinkwork-release-assets
          path: |
            dist/release/thinkwork-release.json
            dist/release/thinkwork-release.sig.json
            dist/release/platform-artifacts.tar.gz
            dist/release/runner/thinkwork-runner.py
          retention-days: 7

  # ── Resolve customer image-mirror targets ───────────────────────
  #
  # THINK-616. Customer accounts come from `.github/release-mirror-targets.json`
  # (or the RELEASE_MIRROR_TARGETS repo variable, same shape) so a new enterprise
  # account inherits the mirror without editing this workflow.
  resolve-mirror-targets:
    name: Resolve customer mirror targets
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      targets: ${{ steps.targets.outputs.value }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}

      - name: Load mirror targets
        id: targets
        env:
          RELEASE_MIRROR_TARGETS: ${{ vars.RELEASE_MIRROR_TARGETS || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_MIRROR_TARGETS}" ]]; then
            printf '%s' "${RELEASE_MIRROR_TARGETS}" > mirror-targets.json
            echo "Using RELEASE_MIRROR_TARGETS repository variable."
          elif [[ -f .github/release-mirror-targets.json ]]; then
            cp .github/release-mirror-targets.json mirror-targets.json
            echo "Using checked-in .github/release-mirror-targets.json."
          else
            # Checkouts are pinned to the release tag, so re-publishing a tag cut
            # before this file landed finds nothing to mirror. That is a no-op,
            # not a release failure.
            echo '{"targets":[]}' > mirror-targets.json
            echo "::warning::${RELEASE_REF_NAME} predates .github/release-mirror-targets.json; skipping the customer image mirror. Mirror by hand if this release is deployed to a customer stage."
          fi

          targets="$(jq -c '.targets // []' mirror-targets.json)"
          # Every target must be fully specified; a half-configured account would
          # otherwise mirror into the wrong registry or silently no-op.
          bad="$(jq -r '[.targets // [] | .[] | select((.stage // "") == "" or (.accountId // "") == "" or (.region // "") == "" or (.repository // "") == "") | .stage // "<unnamed>"] | join(", ")' mirror-targets.json)"
          if [[ -n "$bad" ]]; then
            echo "::error::Mirror targets missing stage/accountId/region/repository: ${bad}"
            exit 1
          fi
          count="$(jq -r 'length' <<<"$targets")"
          echo "Resolved ${count} customer mirror target(s)."
          jq -r '.[] | "  - \(.stage): \(.accountId)/\(.repository) (\(.region))"' <<<"$targets"
          echo "value=${targets}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  # ── Mirror the arm64 Pi image into customer ECRs ────────────────
  #
  # AgentCore Runtime is arm64-only and the customer deployment runner resolves
  # the runtime image from the CUSTOMER ECR by the exact tag
  # `<releaseVersion>-pi-arm64` (runner.py, Pi runtime reconcile). Without this
  # job every customer release needs a manual docker mirror before
  # `release deploy` can succeed.
  #
  # Auth: the release workflow's ThinkWork AWS credentials (dev account) are used
  # directly against each customer registry. The customer-side grant is the ECR
  # repository policy in terraform/modules/app/agentcore-platform (variable
  # `release_mirror_principal_arns`), so no new IAM user, key, or role is needed.
  #
  # Copy: skopeo copies the source *manifest* by digest, so the pushed image is
  # the single-platform arm64 manifest — not a manifest list missing the arch.
  mirror-customer-images:
    name: Mirror arm64 Pi image (${{ matrix.target.stage }})
    needs: [build-deploy-artifacts, resolve-mirror-targets]
    if: ${{ needs.resolve-mirror-targets.outputs.count != '0' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      # One customer failing must not hide or cancel the others.
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-mirror-targets.outputs.targets) }}
    steps:
      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mirror ${{ env.RELEASE_REF_NAME }}-pi-arm64 to ${{ matrix.target.stage }}
        env:
          SOURCE_REPOSITORY: ${{ needs.build-deploy-artifacts.outputs.pi_arm64_source_repository }}
          SOURCE_DIGEST: ${{ needs.build-deploy-artifacts.outputs.pi_arm64_digest }}
          TARGET_STAGE: ${{ matrix.target.stage }}
          TARGET_ACCOUNT_ID: ${{ matrix.target.accountId }}
          TARGET_REGION: ${{ matrix.target.region }}
          TARGET_REPOSITORY: ${{ matrix.target.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_DIGEST" ]]; then
            echo "::error::Build job did not expose the arm64 Pi image repository/digest."
            exit 1
          fi

          SOURCE_REGISTRY="${SOURCE_REPOSITORY%%/*}"
          TARGET_REGISTRY="${TARGET_ACCOUNT_ID}.dkr.ecr.${TARGET_REGION}.amazonaws.com"
          TARGET_TAG="${RELEASE_REF_NAME}-pi-arm64"

          # ECR authorization tokens carry the calling identity; the customer
          # registry authorizes the push through its repository policy.
          aws ecr get-login-password --region "${AWS_REGION}" \
            | skopeo login --username AWS --password-stdin "$SOURCE_REGISTRY"
          aws ecr get-login-password --region "${TARGET_REGION}" \
            | skopeo login --username AWS --password-stdin "$TARGET_REGISTRY"

          echo "Mirroring ${SOURCE_REPOSITORY}@${SOURCE_DIGEST} -> ${TARGET_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
          if ! skopeo copy \
            "docker://${SOURCE_REPOSITORY}@${SOURCE_DIGEST}" \
            "docker://${TARGET_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"; then
            echo "::error::Mirror to ${TARGET_STAGE} (${TARGET_ACCOUNT_ID}/${TARGET_REPOSITORY}) FAILED; 'release deploy ${RELEASE_REF_NAME} --stage ${TARGET_STAGE}' cannot resolve ${TARGET_TAG}. Confirm the customer ECR repository policy grants the ThinkWork release principal push access."
            exit 1
          fi

          # The runner resolves this tag to an immutable digest; prove it lands.
          MIRRORED_DIGEST="$(aws ecr describe-images \
            --registry-id "$TARGET_ACCOUNT_ID" \
            --repository-name "$TARGET_REPOSITORY" \
            --region "$TARGET_REGION" \
            --image-ids "imageTag=${TARGET_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ "$MIRRORED_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "::error::${TARGET_STAGE}: ${TARGET_TAG} resolved to ${MIRRORED_DIGEST}, expected ${SOURCE_DIGEST}."
            exit 1
          fi
          echo "Mirrored ${TARGET_STAGE}: ${TARGET_REPOSITORY}:${TARGET_TAG} = ${MIRRORED_DIGEST}"

  # ── Publish CLI to npm ──────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: verify
    # Web canary tags share the v* release workflow for deployable assets, but
    # they must not mutate or publish the CLI package version.
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-canary.') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION="${RELEASE_REF_NAME#v}"
          CURRENT=$(node -p "require('./apps/cli/package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            cd apps/cli && npm version "$VERSION" --no-git-tag-version
          fi
          echo "CLI_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build CLI
        run: pnpm --filter thinkwork-cli build

      - name: Publish
        run: cd apps/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Update Homebrew tap ─────────────────────────────────────────
  publish-homebrew:
    name: Update Homebrew Tap
    needs: publish-npm
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-canary.') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Wait for npm propagation
        run: sleep 30

      - name: Get tarball URL and SHA
        id: meta
        run: |
          VERSION="${RELEASE_REF_NAME#v}"
          URL="https://registry.npmjs.org/thinkwork-cli/-/thinkwork-cli-${VERSION}.tgz"
          # Wait for the package to be available
          for i in 1 2 3 4 5; do
            SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
            if [ -n "$SHA" ] && [ "$SHA" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
              break
            fi
            sleep 10
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}
          path: thinkwork

      - uses: actions/checkout@v4
        with:
          repository: thinkwork-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          URL="${{ steps.meta.outputs.url }}"
          SHA="${{ steps.meta.outputs.sha256 }}"
          sed "s|__URL__|${URL}|g; s|__SHA__|${SHA}|g" thinkwork/.github/homebrew-formula.rb.template > homebrew-tap/Formula/thinkwork.rb

      - name: Push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/thinkwork.rb
          git commit -m "thinkwork ${{ steps.meta.outputs.version }}"
          git push

  # ── Create GitHub Release ───────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [publish-npm, publish-homebrew, build-deploy-artifacts]
    if: >-
      always() &&
      needs.build-deploy-artifacts.result == 'success' &&
      (
        (
          needs.publish-npm.result == 'success' &&
          needs.publish-homebrew.result == 'success'
        ) ||
        (
          needs.publish-npm.result == 'skipped' &&
          needs.publish-homebrew.result == 'skipped'
        )
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF_NAME }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${RELEASE_REF_NAME}"
          PREV_TAG=""
          if [[ "$VERSION" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z]+)\.[0-9]+$ ]]; then
            SERIES="${BASH_REMATCH[1]}"
            PREV_TAG=$(git tag --list "${SERIES}.*" --sort=-version:refname | grep -Fxv "$VERSION" | head -1 || true)
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | grep -Ev -- '-[A-Za-z]+\.[0-9]+$' | grep -Fxv "$VERSION" | head -1 || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${VERSION}"
          else
            RANGE="${VERSION}"
          fi
          echo "## What's Changed" > notes.md
          echo "" >> notes.md
          mapfile -t CHANGES < <(git log "$RANGE" --pretty=format:"- %s" --no-merges)
          if [ "${#CHANGES[@]}" -eq 0 ]; then
            echo "- Release artifact refresh for ${VERSION}" >> notes.md
          else
            printf '%s\n' "${CHANGES[@]:0:20}" >> notes.md
            if [ "${#CHANGES[@]}" -gt 20 ]; then
              echo "- ...and $((${#CHANGES[@]} - 20)) more commits" >> notes.md
            fi
          fi
          echo "" >> notes.md
          if [[ "$VERSION" == *"-canary."* ]]; then
            echo "_Canary release for validation before stable promotion._" >> notes.md
            echo "" >> notes.md
          fi
          echo "**Machine-consumed platform artifacts:**" >> notes.md
          echo "Backend Lambda zips, static bundles, runtime images, and the release manifest are attached for deployment automation. Signed releases also include thinkwork-release.sig.json; unsigned canaries must be used only with explicit dogfood trust policy. Human installers are the desktop assets and updater metadata." >> notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "" >> notes.md
          echo "**Install:**" >> notes.md
          echo '```bash' >> notes.md
          if [[ "${IS_CLI_RELEASE}" == "true" ]]; then
            echo "npm install -g thinkwork-cli@${VERSION#v}" >> notes.md
            echo "# or" >> notes.md
            echo "brew install thinkwork-ai/tap/thinkwork" >> notes.md
          else
            echo "thinkwork deploy --stage <stage>" >> notes.md
          fi
          echo '```' >> notes.md
        env:
          IS_CLI_RELEASE: ${{ env.IS_CLI_RELEASE }}

      - name: Download deployable release assets
        uses: actions/download-artifact@v4
        with:
          name: thinkwork-release-assets
          path: dist/release

      - name: Upsert release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$RELEASE_REF_NAME" == *"-canary."* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "$RELEASE_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$RELEASE_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_REF_NAME" \
              --notes-file notes.md \
              "${prerelease_args[@]}"
          fi

      - name: Publish deployable release assets
        run: bash scripts/release/publish-release-assets.sh "$RELEASE_REF_NAME" dist/release
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ contains(env.RELEASE_REF_NAME, '-canary.') }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: ${{ contains(env.RELEASE_REF_NAME, '-canary.') }}
        with:
          terraform_wrapper: false

      - name: Record ThinkWork dev release status pointer
        if: ${{ contains(env.RELEASE_REF_NAME, '-canary.') }}
        working-directory: terraform/examples/greenfield
        run: |
          set -euo pipefail
          terraform init
          terraform workspace select dev
          source ../../../scripts/lib/terraform-output.sh
          evidence_bucket="$(tf_output_raw deployment_evidence_bucket_name 2>/dev/null || echo "")"
          if [ -z "$evidence_bucket" ] || [ "$evidence_bucket" = "null" ]; then
            echo "No deployment evidence bucket output; skipping deployment status pointer."
            exit 0
          fi

          state_machine_arn="$(tf_output_raw deployment_state_machine_arn 2>/dev/null || echo "")"
          runner_project_name="$(tf_output_raw deployment_runner_project_name 2>/dev/null || echo "")"
          manifest_sha256="${{ needs.build-deploy-artifacts.outputs.manifest_sha256 }}"
          if [ -z "$manifest_sha256" ]; then
            echo "::error::Build job did not expose a release manifest digest."
            exit 1
          fi
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_REF_NAME}/thinkwork-release.json"
          release_commit="$(git rev-parse "${RELEASE_REF_NAME}^{commit}")"

          ../../../scripts/release/write-deployment-status.sh \
            --stage "dev" \
            --bucket "$evidence_bucket" \
            --release-version "$RELEASE_REF_NAME" \
            --manifest-url "$manifest_url" \
            --manifest-sha256 "$manifest_sha256" \
            --commit "$release_commit" \
            --source "github-actions-release" \
            --status "succeeded" \
            --state-machine-arn "$state_machine_arn" \
            --runner-project-name "$runner_project_name" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-ref "$GITHUB_REF" \
            --github-workflow "$GITHUB_WORKFLOW" \
            --github-actor "$GITHUB_ACTOR"
