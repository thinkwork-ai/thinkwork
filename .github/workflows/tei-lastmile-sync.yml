name: TEI LastMile → Twenty sync

# Nightly one-way delta sync of TEI's LastMile CRM into their self-hosted
# Twenty (crm.tei.thinkwork.ai) during cutover. Runs migrate-lastmile.ts,
# which is idempotent (upsert by sourceId + id-set deletion mirror), reads
# LastMile strictly read-only, never provisions members, and needs no AWS
# credentials. See plugins/twenty/scripts/migrate-lastmile.ts for the runbook.
#
# Human-owned invariants the job cannot enforce:
#   1. Twenty's "Create company when adding a new person" workflow stays OFF
#      (Settings -> Workflows) — else new-person inserts get mislinked.
#   2. Rotate the shared TWENTY_REP_PASSWORD once validation closes.
#
# Required GitHub config (repo settings):
#   Variables: TEI_TWENTY_PUBLIC_URL   e.g. https://crm.tei.thinkwork.ai
#   Secrets:   TEI_TWENTY_API_KEY      Twenty workspace API key
#              TEI_LASTMILE_DATABASE_URL  read-only LastMile dispatch DSN
# The LastMile RDS security group must admit the runner's egress IP.

on:
  # NIGHTLY SCHEDULE IS GATED until the runner can reach the LastMile RDS.
  # A dry-run from a GitHub-hosted runner times out on 54.83.34.87:5432 — the
  # RDS security group admits fixed IPs (e.g. the operator's) but not GitHub's
  # dynamic runner ranges. Re-enable this block once a stable egress IP is
  # allowlisted (static-IP larger runner, or self-hosted runner in TEI's VPC).
  # schedule:
  #   # 03:00 America/Chicago (CDT = 08:00 UTC).
  #   - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads + reports only; apply writes the delta"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: tei-lastmile-sync
  # Never interrupt an in-flight sync — overlap could double-process a delta.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      TWENTY_PUBLIC_URL: ${{ vars.TEI_TWENTY_PUBLIC_URL }}
      TWENTY_API_KEY: ${{ secrets.TEI_TWENTY_API_KEY }}
      LASTMILE_DATABASE_URL: ${{ secrets.TEI_LASTMILE_DATABASE_URL }}
      # schedule always applies; manual dispatch honors the chosen mode.
      APPLY: ${{ github.event_name == 'schedule' || inputs.mode == 'apply' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required config is present
        run: |
          missing=0
          for var in TWENTY_PUBLIC_URL TWENTY_API_KEY LASTMILE_DATABASE_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required config: $var (set the TEI_* variable/secret in repo settings)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run LastMile → Twenty sync
        # pipefail so a failed sync (e.g. the DB unreachable) fails the job —
        # `| tee` otherwise masks the script's exit code behind tee's success.
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then
            echo "Mode: APPLY (writing delta to Twenty)"
            pnpm --filter @thinkwork/plugin-twenty exec \
              tsx scripts/migrate-lastmile.ts --apply | tee "$GITHUB_WORKSPACE/report.json"
          else
            echo "Mode: DRY-RUN (reads + planned mutations only)"
            pnpm --filter @thinkwork/plugin-twenty exec \
              tsx scripts/migrate-lastmile.ts | tee "$GITHUB_WORKSPACE/report.json"
          fi

      - name: Publish parity report to run summary
        if: always()
        run: |
          {
            echo "### TEI LastMile → Twenty sync";
            echo "";
            echo "- Mode: \`$([ "$APPLY" = "true" ] && echo apply || echo dry-run)\`";
            echo "- Trigger: \`${{ github.event_name }}\`";
            echo "";
            if [ -f "$GITHUB_WORKSPACE/report.json" ]; then
              echo '```json';
              cat "$GITHUB_WORKSPACE/report.json";
              echo '```';
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.run_id }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 30
