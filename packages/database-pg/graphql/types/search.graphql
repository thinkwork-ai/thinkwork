# THINK-263 — unified search broker (find rung).
#
# One fan-out operation over the tenant brain's fast retrieval legs. Each leg
# returns independently (per-leg status) so a slow or failing leg never blanks
# the others. The memory leg is excluded from keystroke find by callers
# (`sources`) and serves ask/dossier surfaces; it reads the caller's own bank.

enum SearchSource {
  THREADS
  WIKI
  ENTITIES
  MEMORY
}

enum SearchLegStatus {
  OK
  TIMEOUT
  ERROR
}

type SearchThreadHit {
  id: ID!
  title: String
  identifier: String
  spaceId: ID
  updatedAt: String
}

type SearchWikiHit {
  page: WikiPage!
  score: Float!
  matchedAlias: String
}

type SearchEntityHit {
  entityId: ID!
  label: String!
  ontologyTypeSlug: String
  summary: String
  aliases: [String!]
  relationshipCount: Int
  evidenceCount: Int
}

type SearchMemoryHit {
  memoryRecordId: ID!
  text: String!
  score: Float
  threadId: ID
  createdAt: String
}

type SearchLeg {
  source: SearchSource!
  status: SearchLegStatus!
  error: String
  threadHits: [SearchThreadHit!]
  wikiHits: [SearchWikiHit!]
  entityHits: [SearchEntityHit!]
  memoryHits: [SearchMemoryHit!]
}

type SearchResults {
  "Shared id across the parallel per-rail calls of one palette query."
  queryId: ID!
  legs: [SearchLeg!]!
}

extend type Query {
  """
  Fan-out search over the requested legs with per-leg timeout isolation.
  Thread results are caller-visibility and hidden-thread filtered; memory
  results read the caller's own bank and exclude hits whose source thread
  the caller cannot open.
  """
  search(
    tenantId: ID!
    query: String!
    sources: [SearchSource!]
    limit: Int = 10
    queryId: ID
  ): SearchResults!

  """
  THINK-263 U5 — server-assembled dossier for one grounded knowledge-graph
  entity: its compiled wiki page (null when none — a degrade, never a
  fabricated fallback), contributing memories, linked threads, and artifacts.
  Every thread-derived surface is fenced behind the caller's thread
  visibility; content from threads the caller cannot open is dropped entirely
  (the thread, its artifacts, and any memory hit stamped with it). Multiple
  grounded matches with no `entityId` selector return a disambiguation list
  and assemble nothing; passing `entityId` resolves the ambiguity.
  """
  entityDossier(
    tenantId: ID!
    query: String!
    entityId: ID
  ): EntityDossierResult!
}

"An artifact produced in an accessible thread linked to the entity."
type DossierArtifact {
  id: ID!
  title: String
  type: String
  threadId: ID
}

"Everything the tenant brain knows about one grounded entity."
type EntityDossier {
  entityId: ID!
  label: String!
  ontologyTypeSlug: String
  summary: String
  aliases: [String!]
  "Compiled Entity page; null when the entity has no page (degrade path)."
  wikiPage: WikiPage
  memories: [SearchMemoryHit!]!
  threads: [SearchThreadHit!]!
  artifacts: [DossierArtifact!]!
}

"""
Two-part dossier result: exactly one of `match` (resolved) or a non-empty
`disambiguation` (>1 grounded candidate) is populated. Both are empty/null
when there is no grounded match.
"""
type EntityDossierResult {
  "The assembled dossier, or null when ambiguous or no grounded match."
  match: EntityDossier
  "Grounded candidates when >1 matched and no `entityId` was supplied."
  disambiguation: [SearchEntityHit!]!
}
