# Knowledge Base domain types for document-backed RAG via Bedrock KB.

type KnowledgeBase {
  id: ID!
  tenantId: ID!
  name: String!
  slug: String!
  description: String
  embeddingModel: String!
  chunkingStrategy: String!
  chunkSizeTokens: Int
  chunkOverlapPercent: Int
  status: String!
  awsKbId: String
  lastSyncAt: AWSDateTime
  lastSyncStatus: String
  documentCount: Int
  errorMessage: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  # THINK-193 U7: per-document edition manifest for operator visibility.
  documents: [KnowledgeBaseDocument!]!
  # External S3 KB source U1: the KB's data sources (source #0 is the
  # migrated managed-upload prefix).
  sources: [KnowledgeBaseSource!]!
}

# One Bedrock data source of a KB. kind: managed-upload | s3-connect |
# snapshot (reserved). accessStatus: pending | healthy | degraded |
# access_revoked | failed. For s3-connect, bucket/prefix point at the
# customer-owned location read in place; filterPatterns is
# {include: [...], exclude: [...]} with Bedrock exclusion-wins semantics.
type KnowledgeBaseSource {
  id: ID!
  tenantId: ID!
  knowledgeBaseId: ID!
  kind: String!
  bucket: String
  prefix: String
  filterPatterns: AWSJSON
  bucketOwnerAccountId: String
  parsingStrategy: String!
  awsDataSourceId: String
  accessStatus: String!
  lastSyncAt: AWSDateTime
  lastSyncStatus: String
  documentCount: Int
  errorMessage: String
  sentinelDocumentKey: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# One row per (data source, document key): the document's stable manifest
# identity across editions (THINK-193 U7). `edition` increments when the
# S3 object's content changes; ingestStatus tracks Bedrock's per-document
# lifecycle plus the ThinkWork deletion states ('deleting',
# 'absent_verified'); projectionStatus is the coarse Hindsight-projection
# signal (memory derivations are the fine-grained truth).
type KnowledgeBaseDocument {
  id: ID!
  knowledgeBaseId: ID!
  dataSourceId: String!
  documentKey: String!
  s3VersionId: String
  etag: String
  contentHash: String
  edition: Int!
  effectiveFrom: AWSDateTime
  effectiveTo: AWSDateTime
  ingestStatus: String!
  projectionStatus: String!
  lastError: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type AgentKnowledgeBase {
  id: ID!
  agentId: ID!
  knowledgeBaseId: ID!
  knowledgeBase: KnowledgeBase
  enabled: Boolean!
  searchConfig: AWSJSON
  createdAt: AWSDateTime!
}

type SpaceKnowledgeBase {
  id: ID!
  tenantId: ID!
  spaceId: ID!
  knowledgeBaseId: ID!
  knowledgeBase: KnowledgeBase
  enabled: Boolean!
  searchConfig: AWSJSON
  createdAt: AWSDateTime!
}

input CreateKnowledgeBaseInput {
  tenantId: ID!
  name: String!
  description: String
  embeddingModel: String
  chunkingStrategy: String
  chunkSizeTokens: Int
  chunkOverlapPercent: Int
}

input UpdateKnowledgeBaseInput {
  name: String
  description: String
  # Changing any chunking field triggers a full re-ingest of all documents
  # (U8) — Bedrock fixes chunking at the data source.
  chunkingStrategy: String
  chunkSizeTokens: Int
  chunkOverlapPercent: Int
}

# Connect an existing customer-owned S3 bucket/prefix as an s3-connect
# source (external S3 KB source U4). Exclusion patterns win over inclusion.
# The platform verifies access AS the KB service role before anything is
# created; failures surface synchronously with the missing grant named.
input ConnectKnowledgeBaseSourceInput {
  knowledgeBaseId: ID!
  bucket: String!
  prefix: String!
  include: [String!]
  exclude: [String!]
  # V1 is same-account only; a foreign account ID is rejected.
  bucketOwnerAccountId: String
}

input AgentKnowledgeBaseInput {
  knowledgeBaseId: ID!
  enabled: Boolean
  searchConfig: AWSJSON
}

input SpaceKnowledgeBaseInput {
  knowledgeBaseId: ID!
  enabled: Boolean
  searchConfig: AWSJSON
}

# A single ranked result from a native test query against a KB (U10).
type KnowledgeBaseRetrievalHit {
  snippet: String!
  score: Float
  source: String
}

# Operator inspection result. `status` distinguishes a provisioned-but-empty
# KB ("ok") from one that was never provisioned ("not_provisioned"), so the
# UI doesn't show "no results" for a KB that actually needs a retry.
type KnowledgeBaseRetrievalResult {
  status: String!
  hits: [KnowledgeBaseRetrievalHit!]!
}

extend type Query {
  knowledgeBases(tenantId: ID!): [KnowledgeBase!]!
  knowledgeBase(id: ID!): KnowledgeBase
  testKnowledgeBaseRetrieval(
    id: ID!
    query: String!
  ): KnowledgeBaseRetrievalResult!
}

extend type Mutation {
  createKnowledgeBase(input: CreateKnowledgeBaseInput!): KnowledgeBase!
  updateKnowledgeBase(id: ID!, input: UpdateKnowledgeBaseInput!): KnowledgeBase!
  deleteKnowledgeBase(id: ID!): Boolean!
  syncKnowledgeBase(id: ID!): KnowledgeBase!
  retryKnowledgeBase(id: ID!): KnowledgeBase!
  setAgentKnowledgeBases(
    agentId: ID!
    knowledgeBases: [AgentKnowledgeBaseInput!]!
  ): [AgentKnowledgeBase!]!
  connectKnowledgeBaseSource(
    input: ConnectKnowledgeBaseSourceInput!
  ): KnowledgeBaseSource!
}

extend type Agent {
  knowledgeBases: [AgentKnowledgeBase!]!
}
