# Artifacts: durable, markdown-first agent output.

type Artifact {
  id: ID!
  tenantId: ID!
  agentId: ID
  threadId: ID
  # Living Artifacts (THINK-145): the space a saved canvas belongs to. Null for
  # draft (unsaved) canvases and all legacy artifacts.
  spaceId: ID
  # Version-chain head pointer. 0 until the canvas has been pinned/checked in.
  headVersion: Int!
  title: String!
  type: ArtifactType!
  status: ArtifactStatus!
  content: String
  s3Key: String
  summary: String
  sourceMessageId: ID
  metadata: AWSJSON
  favoritedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  # Pinned, content-addressed version history (read-only; newest first).
  versions: [ArtifactVersion!]!
  # Per-widget data-source bindings — the saved tool call behind each widget.
  bindings: [ArtifactDataBinding!]!
  # HTML Document Artifacts (THINK-147): the single-file HTML render body for
  # document-kind artifacts (metadata.kind == "document"), served only through
  # this access-gated resolver — never via presigned URLs. Null for all other
  # artifact kinds. The markdown digest remains the canonical `content` body.
  renderHtml: String
}

# A content-addressed, write-once pinned revision of a canvas artifact.
type ArtifactVersion {
  id: ID!
  tenantId: ID!
  artifactId: ID!
  version: Int!
  s3Key: String!
  contentHash: String!
  createdBy: ID
  createdAt: AWSDateTime!
}

# Refresh identity of a data binding.
enum ArtifactBindingAuthContext {
  TENANT_MCP
  PER_USER_OAUTH
}

# Freshness / quality state of a bound widget's data.
enum ArtifactBindingQuality {
  GOOD
  STALE
  BAD
  SCHEMA_STALE
}

# Result of createCanvasRefreshSchedule (THINK-145 U7).
type CanvasRefreshSchedule {
  scheduledJobId: ID!
  scheduleExpression: String!
}

# Per-binding outcome of a headless canvas data-refresh (THINK-145 U6).
enum CanvasRefreshOutcome {
  # Fresh data applied to the head; quality flipped to GOOD.
  REFRESHED
  # Result shape changed — head untouched, an agent re-emit is required (R7).
  SCHEMA_STALE
  # Per-user-OAuth binding excluded from unattended refresh (R9).
  NEEDS_USER
  # Transient tool / transport failure; last-good retained, quality BAD (R8).
  FAILED
  # Referenced MCP server no longer resolves; terminal quality BAD (R8).
  SERVER_MISSING
  # Head write raced a concurrent spec change; not applied (KTD6).
  SKIPPED
}

# One binding's result inside a CanvasRefreshResult.
type CanvasRefreshBindingResult {
  bindingId: ID!
  partId: String!
  elementId: String!
  outcome: CanvasRefreshOutcome!
  quality: ArtifactBindingQuality!
  reason: String
}

# Result of a refreshCanvasData mutation. `dispatched` is false when the refresh
# Lambda could not be invoked or returned no result; `errorMessage` carries why.
type CanvasRefreshResult {
  artifactId: ID!
  dispatched: Boolean!
  errorMessage: String
  bindings: [CanvasRefreshBindingResult!]!
}

# The saved tool call behind a bound widget (KTD2). Frozen args are stored
# unredacted server-side; provenance display passes the redaction gate.
type ArtifactDataBinding {
  id: ID!
  tenantId: ID!
  artifactId: ID!
  partId: String!
  elementId: String!
  mcpServerRef: String!
  serverName: String!
  toolName: String!
  # Frozen invocation args passed through the KTD9 redaction gate server-side.
  # Raw args are NEVER exposed — R15 widened provenance to every space member,
  # so secret-shaped keys, PII value shapes, and over-cap values are masked.
  redactedArgs: AWSJSON!
  resultShapeHash: String!
  authContext: ArtifactBindingAuthContext!
  ownerUserId: ID
  quality: ArtifactBindingQuality!
  lastFetchedAt: AWSDateTime
  lastGoodAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Applet {
  artifact: Artifact!
  appId: ID!
  name: String!
  version: Int!
  tenantId: ID!
  threadId: ID
  prompt: String
  agentVersion: String
  modelId: String
  generatedAt: AWSDateTime!
  stdlibVersionAtGeneration: String!
  # User who generated the applet, resolved through the source thread
  # (threadId -> threads.user_id -> users). Null when the applet has no
  # associated thread/user. `userName` falls back to email when the user
  # has no display name set.
  userId: ID
  userName: String
}

type AppletPayload {
  applet: Applet!
  files: AWSJSON!
  source: String!
  metadata: AWSJSON!
  themeCss: String
}

input AdminUpdateAppletSourceInput {
  appId: ID!
  source: String!
}

type AppletConnection {
  nodes: [Applet!]!
  nextCursor: String
}

type SaveAppletPayload {
  ok: Boolean!
  appId: ID
  version: Int
  validated: Boolean!
  persisted: Boolean!
  errors: [AWSJSON!]!
}

type AppletState {
  appId: ID!
  instanceId: ID!
  key: String!
  value: AWSJSON
  updatedAt: AWSDateTime!
}

enum ArtifactType {
  DATA_VIEW
  APPLET
  APPLET_STATE
  NOTE
  REPORT
  PLAN
  DRAFT
  DIGEST
  # HTML Document Artifacts (THINK-147): document genres beyond REPORT/PLAN.
  IDEATION
  BRIEF
}

enum ArtifactStatus {
  DRAFT
  FINAL
  SUPERSEDED
}

input CreateArtifactInput {
  tenantId: ID!
  agentId: ID
  threadId: ID
  title: String!
  type: ArtifactType!
  status: ArtifactStatus
  content: String
  s3Key: String
  summary: String
  sourceMessageId: ID
  metadata: AWSJSON
}

input PromoteGenUIArtifactInput {
  threadId: ID!
  sourceMessageId: ID!
  partId: String!
  specHash: String!
  idempotencyKey: String!
}

input UpdateArtifactInput {
  title: String
  type: ArtifactType
  status: ArtifactStatus
  content: String
  s3Key: String
  summary: String
  metadata: AWSJSON
  # Nullable AWSDateTime. Set an ISO 8601 timestamp to mark the artifact
  # as a favorite (drives the apps/web sidebar Favorites section);
  # pass `null` to clear the flag. Other fields are unchanged either way.
  favoritedAt: AWSDateTime
}

input SaveAppletInput {
  appId: ID
  name: String!
  files: AWSJSON!
  metadata: AWSJSON
}

input PromoteDraftAppletInput {
  draftId: ID!
  computerId: ID!
  threadId: ID!
  name: String!
  files: AWSJSON!
  metadata: AWSJSON
  sourceDigest: String!
  promotionProof: String!
  promotionProofExpiresAt: AWSDateTime!
}

input SaveAppletStateInput {
  appId: ID!
  instanceId: ID!
  key: String!
  value: AWSJSON
}

extend type Query {
  artifacts(
    tenantId: ID!
    threadId: ID
    agentId: ID
    type: ArtifactType
    status: ArtifactStatus
    # When true, return only artifacts with a non-null favoritedAt,
    # ordered favoritedAt DESC. Drives the apps/web sidebar
    # Favorites section.
    favoritedOnly: Boolean
    # Living Artifacts (THINK-145, R14): canvas list surfaces default to SAVED
    # canvases. Set true to also return draft-status canvases (unsaved GenUI
    # emissions). Non-canvas artifacts are always returned regardless.
    includeDrafts: Boolean
    limit: Int
    cursor: String
  ): [Artifact!]!
  artifact(id: ID!): Artifact
  applet(appId: ID!): AppletPayload
  applets(cursor: String, limit: Int): AppletConnection!
  appletState(appId: ID!, instanceId: ID!, key: String!): AppletState
  adminApplet(appId: ID!): AppletPayload
  adminApplets(
    tenantId: ID!
    userId: ID
    cursor: String
    limit: Int
  ): AppletConnection!
}

extend type Mutation {
  createArtifact(input: CreateArtifactInput!): Artifact!
  # DEPRECATED for canvases (Living Artifacts THINK-145, R10): GenUI canvases
  # are born as draft artifacts and saved via `saveCanvas` (a status flip, not
  # a promote-copy). This remains only for legacy/non-canvas callers.
  promoteGenUIArtifact(input: PromoteGenUIArtifactInput!): Artifact!
  # Living Artifacts (THINK-145 U4): save a draft canvas — status flip + naming
  # + space assignment (R10/R12/R15). Re-saving a saved canvas auto-pins the
  # prior head as a version (KTD3 check-in rule).
  saveCanvas(artifactId: ID!, title: String!, spaceId: ID!): Artifact!
  # Pin the current canvas head as a write-once, content-addressed version (R11).
  pinArtifact(artifactId: ID!): Artifact!
  # Living Artifacts (THINK-145 U8, R13): reopen a saved canvas in a same-space
  # thread. Materializes its head as a live part under its original stable part
  # id; a later re-emission + re-save appends a version to the SAME artifact.
  # Cross-space check-out is rejected.
  checkoutCanvas(artifactId: ID!, threadId: ID!): Artifact!
  # Living Artifacts (THINK-145 U6): headless data-refresh (R6). Re-executes the
  # saved tool calls behind a canvas's bound widgets and updates their freshness
  # WITHOUT an agent turn. Any space member may trigger it (read-side freshness
  # action); the per-user-OAuth exclusion (R9) is enforced server-side. Pass
  # `partId` to refresh only that part's bindings.
  refreshCanvasData(artifactId: ID!, partId: String): CanvasRefreshResult!
  # Living Artifacts (THINK-145 U7): create a recurring headless refresh schedule
  # for a canvas (R6 schedule leg). Write-side (member-or-above) — standing up
  # background infra. `intervalMinutes` is floored at 15; per-tenant capped.
  createCanvasRefreshSchedule(
    artifactId: ID!
    intervalMinutes: Int!
    partId: String
  ): CanvasRefreshSchedule!
  updateArtifact(id: ID!, input: UpdateArtifactInput!): Artifact!
  deleteArtifact(id: ID!): Boolean!
  saveApplet(input: SaveAppletInput!): SaveAppletPayload!
  promoteDraftApplet(input: PromoteDraftAppletInput!): SaveAppletPayload!
  regenerateApplet(input: SaveAppletInput!): SaveAppletPayload!
  adminUpdateAppletSource(input: AdminUpdateAppletSourceInput!): SaveAppletPayload!
  saveAppletState(input: SaveAppletStateInput!): AppletState!
}
