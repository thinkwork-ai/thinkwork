# Plate registry (THINK-153): tenant-scoped document genre plates.
#
# A plate is a registered genre — display config, palette token overrides,
# directive availability — resolved as platform definition → tenant document
# palette → per-plate overrides. Platform plates are code-defined; rows store
# only tenant deltas and tenant-created plates. Every save is validated by
# compiling a per-plate exemplar through the compositor plus full DocSpector
# preflight (KTD7) — failures persist nothing.

enum DocumentPlateOrigin {
  platform
  tenant
}

type DocumentPlate {
  slug: ID!
  displayName: String!
  useFor: String!
  eyebrow: String!
  titleSuffix: String!
  # Resolved effective CSS custom-property overrides (platform + tenant
  # palette + per-plate deltas). Empty object = base palette.
  tokensLight: AWSJSON!
  tokensDark: AWSJSON!
  # Directive kinds documents in this plate may use; null = all.
  allowedDirectives: [String!]
  origin: DocumentPlateOrigin!
  hidden: Boolean!
  # True when a platform plate has a tenant delta row.
  customized: Boolean!
  # The tenant's raw delta config for this plate (drives the editor form and
  # reset); null when the plate is untouched platform default.
  overrides: AWSJSON
  # THINK-188: the RESOLVED content contract. Sections is a JSON array of
  # { id, title, tier, guidance, suggestedDirectives?, source, overridden? }
  # where source is "platform" (floor) or "tenant" (addition) and overridden
  # flags which fields a tenant patched on a floor section. Null = none.
  sections: AWSJSON
  # JSON array of { key, op, presentation, source }. Null = none.
  analyses: AWSJSON
}

# THINK-189: per-plate conformance aggregates over the report corpus.
# Judge-derived counts carry their own denominator (judgedReportCount /
# per-section judgedRuns) — judge coverage may lag structural coverage, and
# rates must never present over a silently smaller sample.
type PlateConformanceSummary {
  plateSlug: ID!
  # Structural denominator: reports aggregated (newest-first, capped).
  reportCount: Int!
  # Judge denominator: reports with a complete judge verdict.
  judgedReportCount: Int!
  pendingCount: Int!
  errorCount: Int!
  skippedCount: Int!
  # JSON array of per-section aggregates: { sectionId, runCount,
  # presentCount, waivedCount, missingCount, directiveSuggestedRuns,
  # directiveUsedRuns, judgedRuns, judgedThinRuns, assertedNotComputedRuns }
  sections: AWSJSON!
  # JSON array of { key, declaredRuns, computedRuns }
  analyses: AWSJSON!
}

type TenantDocumentPalette {
  light: AWSJSON!
  dark: AWSJSON!
}

type DocumentPlatePreview {
  # Compiled exemplar HTML; null when validation failed.
  html: String
  # Validation/compile diagnostics (empty when html is present).
  diagnostics: [DocumentPlateDiagnostic!]!
}

type DocumentPlateDiagnostic {
  code: String!
  message: String!
}

input DocumentPlateDraftConfigInput {
  displayName: String
  useFor: String
  eyebrow: String
  titleSuffix: String
  # Token-name → CSS-value maps, plate vocabulary only (R7).
  paletteLight: AWSJSON
  paletteDark: AWSJSON
  allowedDirectives: [String!]
  # THINK-188 contract fields — tenant plates: the full contract; platform
  # plates: additions, with sectionOverrides patching floor sections.
  sections: AWSJSON
  analyses: AWSJSON
  sectionOverrides: AWSJSON
}

input SaveDocumentPlateInput {
  tenantId: ID
  slug: String!
  # Platform plates accept palette, hidden, and content-contract deltas under
  # the floor rules (THINK-188 R8); identity fields stay tenant-plate-only.
  # displayName + useFor are required when creating a tenant plate.
  displayName: String
  useFor: String
  eyebrow: String
  titleSuffix: String
  paletteLight: AWSJSON
  paletteDark: AWSJSON
  allowedDirectives: [String!]
  hidden: Boolean
  # THINK-188 contract fields (JSON arrays / object, validated server-side).
  sections: AWSJSON
  analyses: AWSJSON
  sectionOverrides: AWSJSON
}

input UpdateTenantDocumentPaletteInput {
  tenantId: ID
  light: AWSJSON!
  dark: AWSJSON!
}

type DeleteDocumentPlateResult {
  ok: Boolean!
  error: String
}

extend type Query {
  # All plates for the tenant: platform library then tenant-created. Hidden
  # plates are included for operators only.
  documentPlates(tenantId: ID): [DocumentPlate!]!
  # Compile the plate's exemplar (optionally with unsaved draft config) and
  # return the HTML inline — no artifact persisted. Hidden plates preview for
  # operators only.
  documentPlatePreview(
    tenantId: ID
    slug: String!
    draftConfig: DocumentPlateDraftConfigInput
  ): DocumentPlatePreview!
  tenantDocumentPalette(tenantId: ID): TenantDocumentPalette!
}

extend type Mutation {
  # Create or update a plate (operator-gated). Runs the three-gate validation
  # (token guard + exemplar compile + DocSpector preflight); rejects persist
  # nothing. Saving a platform slug with empty palettes and hidden=false
  # resets it to platform defaults.
  saveDocumentPlate(input: SaveDocumentPlateInput!): DocumentPlate!
  # Delete a tenant-created plate (operator-gated). Refused for platform
  # plates and for slugs still referenced by artifacts — hide instead.
  deleteDocumentPlate(tenantId: ID, slug: String!): DeleteDocumentPlateResult!
  # Set the tenant-wide document palette (operator-gated, validated).
  updateTenantDocumentPalette(
    input: UpdateTenantDocumentPaletteInput!
  ): TenantDocumentPalette!
}
