# Company Brain twin read queries (plan 2026-07-21-001 U6).
#
# The agent's read surface over the Neptune digital twin: typed requests
# only — the VPC twin-query Lambda compiles them server-side (no raw graph
# query surface exists anywhere). Tenant scope resolves turn-bound for
# service callers (the knowledge-graph search-auth discipline); results are
# AWSJSON payloads of the shape { ok, results | reason } with per-fact
# provenance stamps the Pi tool layer formats.
#
# `filter` on twinCohort carries { predicates: [{ facet, attribute, op,
# value? }], path?: { relationship, targetType, predicates } } — the
# KTD-5 typed cohort grammar declared alongside facets in the ontology.

extend type Query {
  twinEntity(tenantId: ID, canonicalId: ID!): AWSJSON!
  twinNeighbors(tenantId: ID, canonicalId: ID!, depth: Int = 1): AWSJSON!
  twinSystemEdges(tenantId: ID, canonicalId: ID!): AWSJSON!
  twinCohort(
    tenantId: ID
    entityType: String!
    filter: AWSJSON!
    limit: Int = 25
  ): AWSJSON!
  """
  Projected entity page (U8 / KTD-8): the entity's operator-declared
  sections, each resolved independently to OK/STALE/TIMEOUT/ERROR with age
  and provenance — or { projected: false, reason } when the tenant/type
  hasn't flipped (AE8 dual-read; the caller renders the compiled page).
  Visibility scopes apply server-side.
  """
  twinEntityPage(tenantId: ID, entityType: String!, canonicalId: ID!): AWSJSON!
  """
  Open materialization suggestions (R8) — operator surface (ontology tab).
  """
  twinMaterializationSuggestions(tenantId: ID): AWSJSON!
}

extend type Mutation {
  """
  Record a cohort gap on a limited facet (R8). Service/turn-bound callers
  (the agent names a gap) and admins. Deduped by (entity type, facet).
  """
  recordTwinMaterializationSuggestion(
    tenantId: ID
    entityTypeSlug: String!
    facetSlug: String!
    question: String
  ): AWSJSON!
  dismissTwinMaterializationSuggestion(
    tenantId: ID
    suggestionId: ID!
  ): Boolean!
}
