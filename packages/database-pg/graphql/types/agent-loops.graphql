# First-class AgentLoop product API.
#
# AgentLoops are the user-facing automation primitive for autonomous
# goal/policy loops. scheduled_jobs remains internal EventBridge plumbing.

enum AgentLoopLifecycleStatus {
  draft
  active
  paused
  archived
}

enum AgentLoopVersionStatus {
  draft
  active
  superseded
  archived
}

# THINK-137 U3 (R2): trigger families are schedule|webhook; `manual` stays a
# valid run source / "no automatic trigger" family. The dead families
# api/app_event/n8n are retired from the product surface (DB CHECK narrowing is
# deferred to U10).
enum AgentLoopTriggerFamily {
  manual
  schedule
  webhook
}

enum AgentLoopRunStatus {
  queued
  running
  waiting_for_human
  completed
  failed
  budget_stopped
  escalated
  canceled
  skipped
}

enum AgentLoopIterationStatus {
  queued
  running
  completed
  failed
  budget_stopped
  waiting_for_human
  canceled
}

enum AgentLoopJudgeMode {
  self_check
  human_approval
  model_judge
  reviewer_agent
  eval_threshold
  external_callback
}

enum AgentLoopJudgmentOutcome {
  complete
  continue
  failed
  budget_stopped
  needs_human_approval
  escalated
}

enum AgentLoopEvidenceRedactionState {
  summary_only
  redacted
  offloaded
  raw_allowed
}

type AgentLoop {
  id: ID!
  tenantId: ID!
  name: String!
  slug: String!
  description: String
  lifecycleStatus: AgentLoopLifecycleStatus!
  enabled: Boolean!
  ownerUserId: ID
  ownerAgentId: ID
  # THINK-137 U3 (R1): the user identity a run acts as. Defaults to the creator.
  runAsUserId: ID
  spaceId: ID
  primaryTriggerFamily: AgentLoopTriggerFamily!
  currentVersionId: ID
  currentVersionNumber: Int
  currentVersion: AgentLoopVersion
  lastRunId: ID
  lastRunStatus: AgentLoopRunStatus
  lastRunAt: AWSDateTime
  lastRunSummary: AWSJSON!
  acceptedRunCount: Int!
  rejectedRunCount: Int!
  escalatedRunCount: Int!
  totalCostUsdCents: Int!
  costPerAcceptedRunUsdCents: Int
  versions: [AgentLoopVersion!]!
  runs(limit: Int, cursor: String, status: AgentLoopRunStatus): [AgentLoopRun!]!
  # THINK-137 U6 (R6): the inbound webhook endpoint minted for a webhook-trigger
  # automation. Null when the automation has no bound webhook row (non-webhook
  # triggers, or pre-U6 rows). The UI renders the endpoint URL as
  # `<api-base><path>` and copies the token.
  webhookEndpoint: AgentLoopWebhookEndpoint
  # THINK-137 U8 (R8): recent inbound webhook deliveries for this Automation's
  # bound endpoint. METADATA-ONLY — no request body, sha, size, or source IP is
  # ever exposed here. The Settings → Webhooks surface (which showed raw bodies
  # behind requireAdminOrServiceCaller) retires; the Automation detail is the
  # successor surface, so this field deliberately narrows to non-PII metadata as
  # defense-in-depth even though both surfaces share the same admin auth gate.
  # Newest first; hard cap 200, default 50. Empty when there is no bound webhook.
  webhookDeliveries(limit: Int): [AutomationWebhookDelivery!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# The inbound webhook endpoint bound to a webhook-trigger Automation (R6).
type AgentLoopWebhookEndpoint {
  webhookId: ID!
  token: String!
  # Path to POST deliveries to, relative to the webhooks API host: `/webhooks/<token>`.
  path: String!
  # Mirrors the automation's enabled state — a disabled endpoint 404s inbound.
  enabled: Boolean!
}

# Metadata-only view of a webhook_deliveries row for the Automation detail
# (THINK-137 U8, R8). Intentionally OMITS bodyPreview / bodySha256 /
# bodySizeBytes / sourceIp / headers — the raw body is never selected by the
# AgentLoop.webhookDeliveries resolver, so it can never reach this surface.
type AutomationWebhookDelivery {
  id: ID!
  receivedAt: AWSDateTime!
  resolutionStatus: String!
  signatureStatus: String!
  statusCode: Int
  providerName: String
  providerEventId: String
  normalizedKind: String
  threadId: ID
  threadCreated: Boolean
  isReplay: Boolean!
  retryCount: Int!
  durationMs: Int
  errorMessage: String
}

type AgentLoopVersion {
  id: ID!
  tenantId: ID!
  agentLoopId: ID!
  agentLoop: AgentLoop
  versionNumber: Int!
  versionStatus: AgentLoopVersionStatus!
  triggerSpec: AWSJSON!
  goalSpec: AWSJSON!
  workerSpec: AWSJSON!
  judgeSpec: AWSJSON!
  loopPolicy: AWSJSON!
  evidencePolicy: AWSJSON!
  # Deterministic routine actions (plan 2026-07-03-004 U5, R7). Null when
  # the version has none; {actions: [{routineId, input?, label?}],
  # agentTurn} otherwise — agentTurn=false is a routine-only Automation.
  routineActionsSpec: AWSJSON
  # THINK-137 U3 (R3): the authoritative target spec —
  # {kind: agent_thread|routine|workflow, ...}. Never null on versions written
  # after the U3 deploy (derived from legacy inputs when the caller sends none);
  # null only on pre-U3 rows the backfill hasn't reached, where
  # targetSpecFromLegacy is the read-fallback.
  targetSpec: AWSJSON
  sourceMetadata: AWSJSON!
  createdByActorType: String
  createdByActorId: ID
  publishedAt: AWSDateTime
  createdAt: AWSDateTime!
}

type AgentLoopRun {
  id: ID!
  tenantId: ID!
  agentLoopId: ID!
  agentLoop: AgentLoop
  agentLoopVersionId: ID
  agentLoopVersion: AgentLoopVersion
  threadId: ID
  status: AgentLoopRunStatus!
  triggerFamily: AgentLoopTriggerFamily!
  triggerSource: String
  scheduledJobId: ID
  actorType: String
  actorId: ID
  idempotencyKey: String
  correlationId: String
  currentIteration: Int!
  terminalReason: String
  policySnapshot: AWSJSON!
  inputSummary: AWSJSON
  outputSummary: AWSJSON
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  lastEventAt: AWSDateTime
  errorCode: String
  errorMessage: String
  totalCostUsdCents: Int
  iterations: [AgentLoopIteration!]!
  judgments: [AgentLoopJudgment!]!
  evidence: [AgentLoopEvidence!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type AgentLoopIteration {
  id: ID!
  tenantId: ID!
  agentLoopRunId: ID!
  agentLoopRun: AgentLoopRun
  iterationNumber: Int!
  status: AgentLoopIterationStatus!
  goalModeAction: String
  agentWakeupRequestId: ID
  threadTurnId: ID
  threadId: ID
  inputSummary: AWSJSON
  outputSummary: AWSJSON
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  errorCode: String
  errorMessage: String
  totalCostUsdCents: Int
  judgments: [AgentLoopJudgment!]!
  evidence: [AgentLoopEvidence!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type AgentLoopJudgment {
  id: ID!
  tenantId: ID!
  agentLoopRunId: ID!
  agentLoopRun: AgentLoopRun
  agentLoopIterationId: ID
  judgeMode: AgentLoopJudgeMode!
  outcome: AgentLoopJudgmentOutcome!
  confidence: Int
  rationale: String
  terminalReason: String
  structuredOutput: AWSJSON!
  createdAt: AWSDateTime!
}

type AgentLoopEvidence {
  id: ID!
  tenantId: ID!
  agentLoopId: ID!
  agentLoopRunId: ID
  agentLoopIterationId: ID
  agentLoopJudgmentId: ID
  evidenceType: String!
  sourceSystem: String!
  sourceId: String
  uri: String
  summary: AWSJSON!
  redactionState: AgentLoopEvidenceRedactionState!
  sensitivity: String
  retentionExpiresAt: AWSDateTime
  createdAt: AWSDateTime!
}

input SaveAgentLoopInput {
  id: ID
  tenantId: ID!
  name: String!
  slug: String
  description: String
  lifecycleStatus: AgentLoopLifecycleStatus
  enabled: Boolean
  ownerUserId: ID
  ownerAgentId: ID
  # THINK-137 U3 (R1): the user identity runs act as. Defaults to the caller.
  runAsUserId: ID
  spaceId: ID
  triggerSpec: AWSJSON!
  goalSpec: AWSJSON!
  workerSpec: AWSJSON!
  # THINK-137 U3 (R3): the authoritative target spec. When present it is
  # validated + written; when absent, target_spec is derived from the legacy
  # goal/worker/routineActions inputs so no version row is written NULL.
  targetSpec: AWSJSON
  # THINK-137 U3 (R11): judge / loop-policy / evidence are off the product
  # surface. Still accepted (and ignored) for back-compat; the columns are
  # written with defaults.
  judgeSpec: AWSJSON
  loopPolicy: AWSJSON
  evidencePolicy: AWSJSON
  # Optional routine actions. Validated at save: every routineId must be
  # an enabled git_python routine in this tenant.
  routineActionsSpec: AWSJSON
  sourceMetadata: AWSJSON
}

type DeleteAgentLoopResult {
  id: ID!
  ok: Boolean!
}

input TriggerAgentLoopRunInput {
  agentLoopId: ID!
  idempotencyKey: String
  correlationId: String
  inputSummary: AWSJSON
}

input StartAutomationBuilderInput {
  tenantId: ID!
  builderThreadId: ID
  title: String
  prompt: String
}

type AutomationBuilderSession {
  thread: Thread!
  threadCreated: Boolean!
  setupPrompt: String!
  draft: AWSJSON!
}

input ConfirmAutomationDraftInput {
  builderThreadId: ID!
  input: SaveAgentLoopInput!
}

extend type Query {
  agentLoops(
    tenantId: ID!
    lifecycleStatus: AgentLoopLifecycleStatus
    enabled: Boolean
    limit: Int
    cursor: String
  ): [AgentLoop!]!
  agentLoop(id: ID!): AgentLoop
  agentLoopRun(id: ID!): AgentLoopRun
}

extend type Mutation {
  saveAgentLoop(input: SaveAgentLoopInput!): AgentLoop!
  startAutomationBuilder(
    input: StartAutomationBuilderInput!
  ): AutomationBuilderSession!
  confirmAutomationDraft(input: ConfirmAutomationDraftInput!): AgentLoop!
  deleteAgentLoop(id: ID!): DeleteAgentLoopResult!
  triggerAgentLoopRun(input: TriggerAgentLoopRunInput!): AgentLoopRun!
}
