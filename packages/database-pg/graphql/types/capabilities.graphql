# Capability inspector read surface (capability-mapping plan U3).
#
# One operator-gated query renders the EFFECTIVE merged capability set for an
# agent × Space × Agent Profile × perspective-user selection, computed through
# the runtime's own composer (resolve-agent-runtime-config + the read-only
# workspace-render seam) — never a parallel implementation (R8). Per KTD-9 the
# predicted (inspector) and observed (per-turn manifest, U13) sets share this
# shape, discriminated by `variant`, so divergence diffing is structural.

enum CapabilitySetVariant {
  PREDICTED
  OBSERVED
}

type CapabilityItem {
  # skill | builtin_tool | mcp_server | pi_extension | plugin | agent_profile | context
  capabilityClass: String!
  # Stable identifier: slug / server name / extension assignment id / plugin folder prefix.
  capabilityId: String!
  displayName: String
  active: Boolean!
  # Which layer contributed it and through which path (e.g. "agent: workspace folder",
  # "profile coding: tool_policy", "space: skills folder", "plugin projection").
  provenance: String
  # Why-not-active reason from the enumerated taxonomy (capability-diagnostics.ts).
  # Null when active. UI renders verbatim (R6).
  reason: String
  detail: String
  # MCP servers only, probe mode: stored token status (active | expired | configured).
  tokenStatus: String
}

type EffectiveCapabilitySet {
  variant: CapabilitySetVariant!
  computedAt: AWSDateTime!
  # Resolved-config fingerprint (KTD-3): hash over the documented capability-
  # config inputs. Manifests carry the same value; divergence is asserted only
  # on fingerprint match.
  configFingerprint: String!
  items: [CapabilityItem!]!
}

type CapabilityInspection {
  # ok | invalid_selection | resolution_fault
  state: String!
  stateDetail: String
  # Echo of the resolved selection (agentId is filled in when defaulted).
  agentId: ID
  spaceId: ID
  agentProfileId: ID
  perspectiveUserId: ID
  # True when no perspective user was selected: the set mirrors a real
  # no-invoker (scheduled/wakeup) turn — plugin per-user servers excluded
  # (fail closed), direct OAuth via the agent's human pair (KTD-4).
  noUserBaseline: Boolean!
  predicted: EffectiveCapabilitySet
}

extend type Query {
  capabilityInspector(
    tenantId: ID!
    # Defaults to the tenant's platform agent when omitted (R4).
    agentId: ID
    spaceId: ID
    agentProfileId: ID
    perspectiveUserId: ID
  ): CapabilityInspection!
}
