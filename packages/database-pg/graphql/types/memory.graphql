type MemoryRecord {
  memoryRecordId: ID!
  content: MemoryContent
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  expiresAt: AWSDateTime
  namespace: String
  bankId: String
  ownerType: String
  ownerId: ID
  strategyId: String
  strategy: String
  score: Float
  userSlug: String
  agentSlug: String @deprecated(reason: "Use userSlug")
  factType: String
  confidence: Float
  eventDate: AWSDateTime
  occurredStart: AWSDateTime
  occurredEnd: AWSDateTime
  mentionedAt: AWSDateTime
  tags: [String!]
  accessCount: Int
  proofCount: Int
  context: String
  threadId: String
}

type MemoryContent {
  text: String
}

enum MemoryStrategy {
  SEMANTIC
  PREFERENCES
  SUMMARIES
  EPISODES
  REFLECTIONS
}

enum MemoryRecordScope {
  USER
  OPERATOR
}

type MemorySearchResult {
  records: [MemoryRecord!]!
  totalCount: Int!
}

"""
ThinkWork-owned ledger row for a memory retain attempt.
The retained memory record itself lives in the memory engine; this type exposes
retry, timeout, and dead-letter state for diagnostics.
"""
type MemoryRetainAttempt {
  id: ID!
  tenantId: ID!
  userId: ID
  spaceId: ID
  threadId: ID!
  threadTurnId: ID
  sourceEventKey: String!
  sourceEventType: String!
  provider: String!
  status: String!
  attemptCount: Int!
  maxAttempts: Int!
  nextRetryAt: AWSDateTime
  lockedAt: AWSDateTime
  lockedBy: String
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  backendLatencyMs: Int
  providerDocumentId: String
  providerResult: AWSJSON
  errorClass: String
  errorMessage: String
  metadata: AWSJSON
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

"""
Runtime memory system configuration exposed to the admin UI.
Lets the UI decide which views to render based on the active engine.
"""
type MemorySystemConfig {
  """
  Active long-term memory engine. Always "agentcore" (THINK-406).
  """
  activeEngine: String!
  """
  True when managed AgentCore Memory is provisioned and wired into the
  agent container. This is the always-on baseline — when false, memory
  features may be unavailable.
  """
  managedMemoryEnabled: Boolean!
  """
  True when the active engine supports user-carried memory capture and recall.
  """
  userMemoryEnabled: Boolean!
  """
  True when the active engine supports current-space memory capture and recall.
  """
  spaceMemoryEnabled: Boolean!
  """
  ThinkWork Brain distillation is intentionally deferred from this memory
  provider pivot.
  """
  companyDistillationEnabled: Boolean!
}

type ThreadIdleLearningChangedFile {
  path: String!
  key: String
  beforeHash: String
  afterHash: String
  beforeBytes: Int
  afterBytes: Int
  snapshotKey: String
}

type ThreadIdleLearningRun {
  id: ID!
  tenantId: ID!
  threadId: ID!
  requesterUserId: ID
  scheduledJobId: ID
  activitySequence: Int!
  scheduledFor: AWSDateTime
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  status: String!
  changedFiles: [ThreadIdleLearningChangedFile!]!
  candidateSummary: AWSJSON
  reportS3Key: String
  reportMarkdown: String
  error: String
  budget: AWSJSON
  metadata: AWSJSON
  canRollback: Boolean!
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

extend type Query {
  memoryRecords(
    tenantId: ID
    userId: ID
    assistantId: ID
    namespace: String!
    scope: MemoryRecordScope = USER
    query: String
    limit: Int
  ): [MemoryRecord!]!
  memoryRecordsByIds(tenantId: ID!, ids: [ID!]!): [MemoryRecord!]!
  """
  Session-scoped episodes plus the cross-session reflections filed alongside
  them, for one user. Separate from `memoryRecords` on purpose: episodic
  records are per-thread and would swamp the cross-thread listing, so the
  Memory page loads them as their own facet. Engines with no episodic facet
  return an empty list rather than erroring.
  """
  memoryEpisodicRecords(
    tenantId: ID
    userId: ID
    assistantId: ID
    limit: Int
  ): [MemoryRecord!]!
  memorySearch(
    tenantId: ID
    userId: ID
    assistantId: ID
    query: String!
    strategy: MemoryStrategy
    limit: Int
  ): MemorySearchResult!
  memorySystemConfig: MemorySystemConfig!
  memoryRetainAttempts(
    tenantId: ID
    userId: ID
    spaceId: ID
    threadId: ID
    status: String
    limit: Int = 50
  ): [MemoryRetainAttempt!]!
  threadIdleLearningRuns(
    tenantId: ID
    userId: ID
    threadId: ID
    limit: Int = 25
  ): [ThreadIdleLearningRun!]!
  threadIdleLearningRun(
    tenantId: ID
    userId: ID
    runId: ID!
  ): ThreadIdleLearningRun
}

extend type Mutation {
  deleteMemoryRecord(
    tenantId: ID
    userId: ID
    assistantId: ID
    memoryRecordId: ID!
  ): Boolean!
  updateMemoryRecord(
    tenantId: ID
    userId: ID
    assistantId: ID
    memoryRecordId: ID!
    content: String!
  ): Boolean!
  rollbackThreadIdleLearningRun(
    tenantId: ID
    userId: ID
    runId: ID!
  ): ThreadIdleLearningRun!
  captureMobileMemory(
    tenantId: ID
    userId: ID
    agentId: ID
    content: String!
    factType: MobileCaptureFactType = FACT
    metadata: AWSJSON
    clientCaptureId: ID
  ): MobileMemoryCapture!
}

"""
Fact-type picker values exposed to the mobile quick-capture footer. Maps to
the engine's native fact type via the resolver. FACT is the default when the
user doesn't override.
"""
enum MobileCaptureFactType {
  FACT
  PREFERENCE
  EXPERIENCE
  OBSERVATION
}

type MobileMemoryCapture {
  id: ID!
  tenantId: ID!
  userId: ID!
  agentId: ID @deprecated(reason: "Use userId")
  content: String!
  factType: MobileCaptureFactType!
  capturedAt: AWSDateTime!
  syncedAt: AWSDateTime
  metadata: AWSJSON
}

extend type Query {
  mobileMemoryCaptures(
    tenantId: ID
    userId: ID
    agentId: ID
    limit: Int = 50
  ): [MobileMemoryCapture!]!
  """
  Free-text search across the full memory bank for the given user.
  Hits the engine's recall endpoint (semantic + rerank) and normalizes results
  back to MobileMemoryCapture so the Memories list can render search results
  with the same rows it uses for captures. Not filtered by capture_source —
  search is meant to answer "what does this user know?", including chat-
  derived observations.
  """
  mobileMemorySearch(
    tenantId: ID
    userId: ID
    agentId: ID
    query: String!
    limit: Int = 20
  ): [MobileMemoryCapture!]!
}

extend type Mutation {
  deleteMobileMemoryCapture(
    tenantId: ID
    userId: ID
    agentId: ID
    captureId: ID!
  ): Boolean!
}

"""
External Memory Compounding (THINK-193 U2). Operator-only inspection and
control surface for external memory sources: processor configs, source
bindings, authorization grants, the evidence ledger, durable claims, and
the retraction ledger. Queries and mutations below require tenant admin,
with one exception (THINK-193 U6): grantMemorySourceAuthorization and
setMemorySourceConfig on a PERSONAL processor are owner self-service,
restricted to family 'email' bound to a connection the caller owns.
"""
type MemoryProcessorConfig {
  id: ID!
  mode: String!
  targetScope: String!
  targetId: ID!
  enabled: Boolean!
  status: String!
  budget: AWSJSON
  createdByUserId: ID
  createdAt: AWSDateTime
}

type MemorySourceConfig {
  id: ID!
  processorConfigId: ID!
  sourceFamily: String!
  sourceBindingKey: String!
  enabled: Boolean!
  boundary: AWSJSON
  createdAt: AWSDateTime
}

"""
Explicit source-access grant — the MAXIMUM readable envelope for a binding.
At most one active grant exists per (processorConfig, sourceFamily,
sourceBindingKey); granting again supersedes the previous grant.
"""
type MemorySourceAuthorization {
  id: ID!
  processorConfigId: ID!
  sourceFamily: String!
  sourceBindingKey: String!
  boundary: AWSJSON
  status: String!
  grantVersion: Int!
  grantedByUserId: ID
  expiresAt: AWSDateTime
  revokedAt: AWSDateTime
  createdAt: AWSDateTime
}

"""
Evidence-ledger row WITHOUT snapshot content. The normalized snapshot and
S3 snapshot ref are redacted by design — operators inspect lineage and
lifecycle here, not source payloads.
"""
type MemoryEvidenceItemSummary {
  id: ID!
  sourceConfigId: ID!
  sourceItemId: String!
  sourceVersion: String!
  contentHash: String!
  lifecycle: String!
  acquisitionRunId: ID
  createdAt: AWSDateTime
}

"""
Durable structured claim. supportCount is the number of ACTIVE
evidence support edges (memory_claim_evidence status = 'active').
"""
type MemoryClaim {
  id: ID!
  subjectKey: String!
  subjectEntityType: String!
  ontologyPredicate: String!
  value: AWSJSON
  valueHash: String!
  status: String!
  conflictState: String!
  effectiveFrom: AWSDateTime
  effectiveTo: AWSDateTime
  extractionVersion: String!
  supportCount: Int!
}

"""
Evidence → memory-document projection lineage row.
"""
type MemoryDerivation {
  id: ID!
  sourceConfigId: ID!
  projectionKey: String!
  targetBankId: String!
  hindsightDocumentId: String!
  currentVersion: String!
  lifecycle: String!
  retractedAt: AWSDateTime
}

"""
Idempotent multi-system retraction ledger row — one per provider document
being retracted or erased.
"""
type MemoryRetractionAttempt {
  id: ID!
  scope: String!
  sourceConfigId: ID!
  providerDocumentId: String!
  targetBankId: String!
  status: String!
  attemptCount: Int!
  maxAttempts: Int!
  nextRetryAt: AWSDateTime
  lockedBy: String
  lockGeneration: Int!
  """
  When the current worker's lease is presumed dead (locked_at + the stale
  window); null when unclaimed.
  """
  leaseExpiresAt: AWSDateTime
  eraseGeneration: Int!
  reconsolidationNote: String
  errorClass: String
  errorMessage: String
  createdAt: AWSDateTime
  completedAt: AWSDateTime
}

"""
Durable status of a source-level erase aggregate: 'completed' only after all
derivations are retracted via the saga, S3 evidence snapshots are deleted,
snapshot payloads cleared / non-derived evidence rows removed, and
checkpoints purged. 'pending' = retractions still in flight; the scheduled
memory-retraction-drainer self-finalizes the erase (child retries AND the
cleanup phase) — no further operator action is required. 'failed' =
dead-lettered children need operator attention.
"""
enum MemorySourceEraseStatus {
  completed
  pending
  failed
}

type MemorySourceEraseResult {
  status: MemorySourceEraseStatus!
  attemptsTotal: Int!
  attemptsRetracted: Int!
  attemptsPending: Int!
  attemptsDeadLettered: Int!
  processedThisCall: Int!
  snapshotObjectsDeleted: Int!
  """
  Object VERSIONS + delete markers removed from the versioned
  brain-artifacts bucket (S1: erase completeness proof).
  """
  snapshotVersionsDeleted: Int!
  evidenceRowsCleared: Int!
  evidenceRowsDeleted: Int!
  checkpointsDeleted: Boolean!
}

"""
A managed memory processor plus its blueprint-owned Workflow (THINK-193 U3).
Personal: one per user (mode personal, agent_private workflow owned by the
user). Shared: operator-owned per Space/Tenant target (tenant_shared
workflow). The workflow definition is always the platform blueprint —
ensured lazily, never hand-authored.
"""
type ManagedMemoryWorkflow {
  processor: MemoryProcessorConfig!
  workflow: Workflow
  sources: [MemorySourceConfig!]!
  """
  ready | blocked_not_ready — computed from workflow readiness and the
  configured source set.
  """
  readiness: String!
  """
  JSON array of {code, message} readiness reasons (empty when ready).
  """
  readinessReasons: AWSJSON
}

"""
One step of the memory pipeline as the Definition tab renders it (THINK-264).
"""
type MemoryPipelineStage {
  """
  Step id in the workflow definition (e.g. "retain").
  """
  id: ID!
  """
  Canonical stage kind: preflight|acquire|extract|project|resolve|retain|compound|graph|wiki.
  """
  stage: String!
  label: String!
  description: String!
  """
  False when the user has switched this stage off. Always true for spine stages.
  """
  enabled: Boolean!
  """
  Whether the user may switch this stage off. Only the optional tail
  (compound/graph/wiki) is toggleable: acquire → project → resolve → retain is
  the pipeline's spine, and disabling any of it would starve everything
  downstream and silently make the automation a no-op.
  """
  toggleable: Boolean!
  """
  This stage's outcome on the most recent run — seen|changed|retracted|
  deferred|failed|noop — or null when the stage did not report an item.
  """
  lastResult: String
}

"""
The live memory pipeline behind the built-in memory Automation (THINK-264):
what it will run, over which sources, and whether it can run at all.
"""
type MemoryPipeline {
  processorConfigId: ID!
  """
  personal | shared
  """
  mode: String!
  workflowId: ID
  """
  The processor's own on/off switch — mirrors AgentLoop.enabled.
  """
  enabled: Boolean!
  """
  ready | blocked_not_ready
  """
  readiness: String!
  """
  JSON array of {code, message} readiness reasons (empty when ready).
  """
  readinessReasons: AWSJSON
  """
  The bound rate(...)/cron(...) expression, or null when there is no schedule.
  """
  scheduleExpression: String
  scheduleTimezone: String
  """
  False when a schedule exists but is switched off (manual runs still work).
  """
  scheduleEnabled: Boolean!
  sources: [MemorySourceConfig!]!
  """
  Ordered pipeline steps, as built from the current blueprint.
  """
  stages: [MemoryPipelineStage!]!
}

extend type Query {
  """
  Owner-only: the signed-in user's Personal Memory Automation. Lazily
  provisions the processor + workflow + current blueprint version on read.
  """
  personalMemoryAutomation: ManagedMemoryWorkflow!
  memoryProcessorConfigs(tenantId: ID): [MemoryProcessorConfig!]!
  memorySourceConfigs(
    tenantId: ID
    processorConfigId: ID!
  ): [MemorySourceConfig!]!
  memorySourceAuthorizations(
    tenantId: ID
    processorConfigId: ID!
  ): [MemorySourceAuthorization!]!
  memoryEvidenceItems(
    tenantId: ID
    sourceConfigId: ID!
    limit: Int
  ): [MemoryEvidenceItemSummary!]!
  memoryClaims(
    tenantId: ID
    targetScope: String!
    targetId: ID!
    subjectKey: String
    limit: Int
  ): [MemoryClaim!]!
  memoryRetractionAttempts(
    tenantId: ID
    sourceConfigId: ID
    limit: Int
  ): [MemoryRetractionAttempt!]!
}

extend type Mutation {
  """
  Operator-only: idempotently ensure the shared Memory Workflow (processor +
  tenant_shared blueprint workflow) for one Space or Tenant target.
  """
  ensureSharedMemoryWorkflow(
    tenantId: ID
    targetScope: String!
    targetId: ID!
  ): ManagedMemoryWorkflow!
  """
  Owner-only: set/clear the caller's personal memory automation schedule.
  enabled=true requires a rate(...)/cron(...) scheduleExpression; false
  disables the scheduled trigger (manual runs stay available).
  """
  setPersonalMemoryAutomationSchedule(
    scheduleExpression: String
    timezone: String
    enabled: Boolean!
  ): ManagedMemoryWorkflow!
  """
  Owner-only: switch one optional pipeline stage on or off (THINK-264).

  Only the optional tail (compound/graph/wiki) may be toggled — a request for
  any spine stage (acquire/project/resolve/retain, or preflight/extract) is
  rejected rather than silently ignored, because disabling one would starve
  every stage after it. The toggle is stored as intent on the processor and
  supersedes the workflow's active blueprint version through the normal lazy
  path; in-flight runs stay pinned to the version they captured.
  """
  setMemoryPipelineStageEnabled(
    agentLoopId: ID!
    stage: String!
    enabled: Boolean!
  ): MemoryPipeline!
  """
  Insert an active grant for a source binding, superseding (revoking) any
  existing active grant for the same binding — one active grant per binding.
  Shared processors: tenant admin. Personal processors (U6): owner
  self-grant of the caller's OWN email connection to the caller's OWN
  personal processor only.
  """
  grantMemorySourceAuthorization(
    tenantId: ID
    processorConfigId: ID!
    sourceFamily: String!
    sourceBindingKey: String!
    boundary: AWSJSON
    expiresAt: AWSDateTime
  ): MemorySourceAuthorization!
  """
  Create, update, or disable a source config (THINK-193 U5/U6). Shared
  processors: tenant admin. Personal processors: owner self-service for
  family 'email' bound to a caller-owned connection. The boundary is
  validated against the family's governed dimension schema and — when an
  active grant exists for the binding — proven within the grant envelope.
  sourceFamily/sourceBindingKey are required on create and immutable
  afterwards.
  """
  setMemorySourceConfig(
    tenantId: ID
    processorConfigId: ID!
    sourceConfigId: ID
    sourceFamily: String
    sourceBindingKey: String
    boundary: AWSJSON
    enabled: Boolean
  ): MemorySourceConfig!
  revokeMemorySourceAuthorization(tenantId: ID, authorizationId: ID!): Boolean!
  """
  Enqueue a retraction for one derivation's memory document and process
  it inline once (RequestResponse semantics — errors surface to the caller).
  """
  retractMemoryDerivation(
    tenantId: ID
    derivationId: ID!
  ): MemoryRetractionAttempt!
  """
  Disable a source config and run the durable erase aggregate: enqueue erase
  attempts for its derivations, drain a bounded batch inline, and — only when
  every derivation is retracted — delete S3 evidence snapshots, clear
  snapshot payloads, remove non-derived evidence rows, and purge checkpoints.
  Partial progress surfaces as status 'pending' and self-finalizes via the
  scheduled drainer (no second mutation needed); dead-lettered children
  surface as status 'failed'.
  """
  eraseMemorySource(tenantId: ID, sourceConfigId: ID!): MemorySourceEraseResult!
  """
  Operator DLQ retry: reset a dead_lettered (or failed) retraction attempt —
  saga child or erase marker — to a due queued state with a fresh attempt
  budget, fenced against stale workers.
  """
  retryMemoryRetractionAttempt(
    tenantId: ID
    attemptId: ID!
  ): MemoryRetractionAttempt!
}
