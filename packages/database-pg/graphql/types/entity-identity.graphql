# Canonical entity identity (THINK-193 U4).
#
# Operator-only (tenant-admin gated) stewardship surface for the identity.*
# registry: canonical entities, exact source mappings, and the ambiguity
# resolution queue. V1 decisions are Link, Create, Defer, Reject, and a
# guarded Merge repair — no Split, no MDM workbench.

"""
A stable canonical entity instance ("Acme"), distinct from the ontology type
definition ("Customer"). Merged entities persist as redirects.
"""
type CanonicalEntity {
  id: ID!
  entityTypeSlug: String!
  displayName: String!
  normalizedName: String!
  status: String!
  mergedIntoId: ID
  version: Int!
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  sourceMappings: [EntitySourceMapping!]!
}

"""
Exact source mapping — one canonical entity per (source system, namespace,
external id). Exact mapping always wins in the matcher.
"""
type EntitySourceMapping {
  id: ID!
  canonicalEntityId: ID!
  sourceSystem: String!
  namespace: String!
  externalId: String!
  visibility: String!
  createdBy: String!
  """
  Set when createdBy='user' — the confirming user (server-derived, R11).
  """
  createdByUserId: ID
  """
  Audit reference to the thread/turn that produced a user confirm.
  """
  createdThreadRef: String
  createdAt: AWSDateTime
}

"""
An open/resolved ambiguity case. Candidates and conflicting claims are
source-safe identity evidence only — never private content.
"""
type EntityResolutionCase {
  id: ID!
  signatureHash: String!
  entityTypeSlug: String!
  displayHint: String
  candidates: AWSJSON!
  conflictingClaims: AWSJSON!
  impactSummary: AWSJSON!
  itemCount: Int!
  status: String!
  decision: String
  decidedByUserId: ID
  resolvedCanonicalEntityId: ID
  decidedAt: AWSDateTime
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

enum EntityResolutionDecision {
  link
  create
  defer
  reject
}

"""
Merge impact preview — computed before the merge and echoed back as the
confirmation input; a stale preview aborts the merge.
"""
type CanonicalEntityMergeImpact {
  sourceMappingCount: Int!
  identityClaimCount: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  loserWikiPageId: ID
  loserWikiPageSlug: String
  survivorWikiPageId: ID
}

input CanonicalEntityMergeImpactInput {
  sourceMappingCount: Int!
  identityClaimCount: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  loserWikiPageId: ID
  loserWikiPageSlug: String
  survivorWikiPageId: ID
}

type CanonicalEntityMergeResult {
  survivorId: ID!
  loserId: ID!
  impact: CanonicalEntityMergeImpact!
}

"""
Which resulting half of a split a source mapping is assigned to (THINK-321
U8, KTD-8). Half `a` keeps the original canonical id; half `b` is the new
canonical entity created by the split.
"""
enum SplitHalf {
  a
  b
}

input SplitMappingAssignmentInput {
  mappingId: ID!
  half: SplitHalf!
}

"""
Split impact preview — computed before the split and echoed back as the
confirmation input; a stale preview aborts the split (mirrors merge).
Memory claims, graph entities, and the wiki page stay on half A and
re-derive on the next compile.
"""
type CanonicalEntitySplitImpact {
  mappingCountA: Int!
  mappingCountB: Int!
  claimCountFollowingB: Int!
  claimCountRemainingA: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  wikiPageId: ID
}

input CanonicalEntitySplitImpactInput {
  mappingCountA: Int!
  mappingCountB: Int!
  claimCountFollowingB: Int!
  claimCountRemainingA: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  wikiPageId: ID
}

type SplitCanonicalEntityResult {
  entityAId: ID!
  entityBId: ID!
  impact: CanonicalEntitySplitImpact!
}

type AuthorEntitySourceMappingResult {
  """
  created | already_linked | refused.
  """
  status: String!
  """
  Refusal reason: entity_not_found | entity_not_active | invalid_input.
  """
  reason: String
  mapping: EntitySourceMapping
  existingMappingId: ID
  existingCanonicalEntityId: ID
}

type RevokeEntitySourceMappingResult {
  """
  revoked | refused.
  """
  status: String!
  """
  Refusal reason: mapping_not_found.
  """
  reason: String
  canonicalEntityId: ID
  sourceSystem: String
  namespace: String
  externalId: String
}

"""
One entity reference for resolveEntities (THINK-321 U5). Exactly one shape
applies, checked in precedence order: canonicalId, then
(sourceSystem, externalId), then (name, entityTypeSlug). A ref matching no
shape resolves to an explicit invalid_ref miss rather than being dropped.
"""
input EntityRefInput {
  canonicalId: ID
  sourceSystem: String
  namespace: String
  externalId: String
  name: String
  entityTypeSlug: String
}

"""
One crosswalk mapping with full provenance (THINK-321 KTD-1/KTD-5).
connectorSlug is null — and fetchable false — when the source system has no
registered connector link (fail-closed): callers must never invent a slug.
"""
type ResolvedEntityMapping {
  sourceSystem: String!
  namespace: String!
  externalId: String!
  connectorSlug: String
  fetchable: Boolean!
  unroutableReason: String
  createdBy: String!
  createdByUserId: ID
  createdThreadRef: String
  createdAt: AWSDateTime
  """
  curated | matched | user_confirmed — who vouches for this link (R3).
  """
  caveat: String!
  confidence: Float
}

type ResolvedEntityHit {
  canonicalEntityId: ID!
  displayName: String!
  entityTypeSlug: String!
  mappings: [ResolvedEntityMapping!]!
}

type EntityRefResolution {
  """
  hit | miss.
  """
  status: String!
  """
  Miss reason: not_found | ambiguous_name | archived | invalid_ref.
  """
  unroutable: String
  entity: ResolvedEntityHit
}

type ResolveEntitiesResult {
  results: [EntityRefResolution!]!
  page: Int!
  limit: Int!
  totalRefs: Int!
  hasMore: Boolean!
}

"""
Candidate proposal result (THINK-321 KTD-2). candidates is the ranked
MappingCandidate array (external-record identity evidence only); the set is
persisted server-side for the consent echo check.
"""
type ProposeMappingCandidatesResult {
  """
  proposed | refused.
  """
  status: String!
  reason: String
  candidateSetId: ID
  candidates: AWSJSON
  expiresAt: AWSDateTime
}

type ConfirmEntityMappingResult {
  """
  confirmed | already_linked | refused.
  """
  status: String!
  reason: String
  mappingId: ID
  canonicalEntityId: ID
  sourceSystem: String
  namespace: String
  externalId: String
  existingMappingId: ID
  existingCanonicalEntityId: ID
}

type DeclineEntityMappingResult {
  """
  declined | refused.
  """
  status: String!
  reason: String
  caseId: ID
  coalesced: Boolean
}

"""
Identity-source registration result (THINK-321 U7, KTD-5). The
source_system → connector link is written and the workspace routing map is
re-projected; entityTypeSlugs echoes the validated target types.
"""
type RegisterIdentitySourceResult {
  tenantId: ID!
  sourceSystem: String!
  connectorSlug: String!
  entityTypeSlugs: [String!]!
  routingMapAgents: Int!
  routingMapWritten: Int!
}

input RegisterIdentitySourceInput {
  tenantId: ID!
  sourceSystem: String!
  connectorSlug: String!
  entityTypeSlugs: [String!]!
}

enum IdentityMatchJobStatus {
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
}

"""
Bootstrap/drift identity match job (THINK-321 U7, KTD-7). Mirrors the
ontology suggestion-scan job: dedupe-key insert-or-load, async Event invoke,
invoke failure marked on the row. Metrics report scanned / autoLinked /
casesFiled / casesExpired so the open-case budget interaction is visible.
"""
type IdentityMatchJob {
  id: ID!
  tenantId: ID!
  status: IdentityMatchJobStatus!
  trigger: String!
  dedupeKey: String
  sourceSystems: [String!]!
  result: AWSJSON!
  metrics: AWSJSON!
  error: String
  createdAt: AWSDateTime
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
}

input StartIdentityMatchJobInput {
  tenantId: ID!
  trigger: String
  dedupeKey: String
  """
  Subset of registered source systems to scan; omitted = all registered.
  """
  sourceSystems: [String!]
}

extend type Query {
  """
  Poll one identity match job (THINK-321 U7). Operator/service gated.
  """
  identityMatchJob(tenantId: ID!, jobId: ID!): IdentityMatchJob
  canonicalEntities(
    tenantId: ID
    entityTypeSlug: String
    search: String
    status: String
    limit: Int
  ): [CanonicalEntity!]!
  canonicalEntity(tenantId: ID, id: ID!): CanonicalEntity
  entityResolutionCases(
    tenantId: ID
    status: String
    limit: Int
  ): [EntityResolutionCase!]!
  entityResolutionCase(tenantId: ID, caseId: ID!): EntityResolutionCase
  canonicalEntityMergePreview(
    tenantId: ID
    survivorId: ID!
    loserId: ID!
  ): CanonicalEntityMergeImpact!
  """
  Split impact preview (THINK-321 U8): the operator's mapping partition is
  validated (every mapping assigned exactly once, both halves non-empty) and
  the resulting impact is returned for the confirm echo. Tenant-admin gated.
  """
  canonicalEntitySplitPreview(
    tenantId: ID
    canonicalEntityId: ID!
    assignments: [SplitMappingAssignmentInput!]!
  ): CanonicalEntitySplitImpact!
  """
  Bulk-first crosswalk resolve (THINK-321 U5, R1/R2). Service (agent-tool)
  callers are turn-bound: tenant derives server-side from the
  x-thread-turn-id / x-thread-id header; other callers are tenant-admin
  gated. Results are paged (server-capped page size) so unbounded bulk
  resolves cannot blow the payload envelope.
  """
  resolveEntities(
    tenantId: ID
    refs: [EntityRefInput!]!
    targetSystems: [String!]
    page: Int
    limit: Int
  ): ResolveEntitiesResult!
}

extend type Mutation {
  """
  Register a source system as an identity source (THINK-321 U7, KTD-5):
  validates the connector row and identity rules for every target entity
  type, writes identity.source_system_connectors, and re-projects the
  workspace routing map. Operator/service gated.
  """
  registerIdentitySource(
    input: RegisterIdentitySourceInput!
  ): RegisterIdentitySourceResult!
  """
  Start (or dedupe onto) a bootstrap/drift identity match job (THINK-321
  U7, KTD-7). The job row is durable; the identity-match Lambda is
  Event-invoked and the caller polls identityMatchJob. Operator/service
  gated.
  """
  startIdentityMatchJob(input: StartIdentityMatchJobInput!): IdentityMatchJob!
  """
  Apply Link / Create / Defer / Reject to an open resolution case.
  `canonicalEntityId` is required for link; `displayName` optionally names a
  created entity (defaults to the case's display hint). Defer keeps the case
  open and resets its expiry clock. Every decision appends an audit event.
  """
  resolveEntityResolutionCase(
    tenantId: ID
    caseId: ID!
    decision: EntityResolutionDecision!
    canonicalEntityId: ID
    displayName: String
  ): EntityResolutionCase!
  """
  Guarded merge repair: the loser becomes a redirect (status merged) and its
  mappings/claims/graph rows/wiki page repoint or archive onto the survivor.
  `confirmImpact` must echo the preview exactly or the merge aborts.
  """
  mergeCanonicalEntities(
    tenantId: ID
    survivorId: ID!
    loserId: ID!
    confirmImpact: CanonicalEntityMergeImpactInput!
  ): CanonicalEntityMergeResult!
  """
  Rank candidate matches for one entity's unmapped target system and persist
  the set for the consent echo check (THINK-321 KTD-2). Turn-bound service
  callers derive threadRef server-side; an asserted threadRef that mismatches
  the derivation is rejected. Admin callers must supply threadRef.
  """
  proposeMappingCandidates(
    tenantId: ID
    canonicalEntityId: ID!
    targetSystem: String!
    threadRef: ID
  ): ProposeMappingCandidatesResult!
  """
  Consent-bound confirm (THINK-321 KTD-2): succeeds only when the echoed
  candidate id equals the user selection recorded at answer intake on an
  open, unexpired set for the same thread. Attribution is SERVER-derived —
  created_by='user' and the user id come from the turn context, never from
  arguments.
  """
  confirmEntityMapping(
    tenantId: ID
    threadRef: ID
    candidateSetId: ID!
    candidateId: String!
  ): ConfirmEntityMappingResult!
  """
  Reject-all path (THINK-321 R16): no mapping is written; a
  signature-deduped resolution case is filed with agent/turn provenance so
  the miss converges to operator stewardship instead of re-asking forever.
  """
  declineEntityMappingCandidates(
    tenantId: ID
    threadRef: ID
    candidateSetId: ID!
  ): DeclineEntityMappingResult!
  """
  Operator hand-authoring of a crosswalk link (THINK-321 U8, R12): bind a
  source-system record to a canonical entity. Tenant-admin gated — never
  reachable by service (agent) callers (write-asymmetry). Writes the mapping
  with created_by='operator' plus a `link` audit event; a source identity
  that is already linked returns a typed already_linked result.
  """
  authorEntitySourceMapping(
    tenantId: ID
    canonicalEntityId: ID!
    sourceSystem: String!
    namespace: String
    externalId: String!
  ): AuthorEntitySourceMappingResult!
  """
  Revoke a crosswalk mapping (THINK-321 U8, R13/R15): deletes the mapping,
  appends a `revoke` audit event, and records negative evidence so the next
  drift pass demotes any re-proposal of the pairing to at most a case.
  Tenant-admin gated (write-asymmetry).
  """
  revokeEntitySourceMapping(
    tenantId: ID
    mappingId: ID!
    reason: String
  ): RevokeEntitySourceMappingResult!
  """
  Guarded split of a wrongly merged canonical entity (THINK-321 U8, R13,
  AE5): the operator partitions the entity's source mappings between half A
  (keeps the original canonical id) and half B (a new canonical entity named
  `newEntityDisplayName`). `confirmImpact` must echo the preview exactly or
  the split aborts. Rejections are written in both directions so the pair is
  not immediately re-proposed for merge. Tenant-admin gated.
  """
  splitCanonicalEntity(
    tenantId: ID
    canonicalEntityId: ID!
    assignments: [SplitMappingAssignmentInput!]!
    newEntityDisplayName: String!
    confirmImpact: CanonicalEntitySplitImpactInput!
  ): SplitCanonicalEntityResult!
}
