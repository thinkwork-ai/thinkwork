# Canonical entity identity (THINK-193 U4).
#
# Operator-only (tenant-admin gated) stewardship surface for the identity.*
# registry: canonical entities, exact source mappings, and the ambiguity
# resolution queue. V1 decisions are Link, Create, Defer, Reject, and a
# guarded Merge repair — no Split, no MDM workbench.

"""
A stable canonical entity instance ("Acme"), distinct from the ontology type
definition ("Customer"). Merged entities persist as redirects.
"""
type CanonicalEntity {
  id: ID!
  entityTypeSlug: String!
  displayName: String!
  normalizedName: String!
  status: String!
  mergedIntoId: ID
  version: Int!
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  sourceMappings: [EntitySourceMapping!]!
}

"""
Exact source mapping — one canonical entity per (source system, namespace,
external id). Exact mapping always wins in the matcher.
"""
type EntitySourceMapping {
  id: ID!
  canonicalEntityId: ID!
  sourceSystem: String!
  namespace: String!
  externalId: String!
  visibility: String!
  createdBy: String!
  createdAt: AWSDateTime
}

"""
An open/resolved ambiguity case. Candidates and conflicting claims are
source-safe identity evidence only — never private content.
"""
type EntityResolutionCase {
  id: ID!
  signatureHash: String!
  entityTypeSlug: String!
  displayHint: String
  candidates: AWSJSON!
  conflictingClaims: AWSJSON!
  impactSummary: AWSJSON!
  itemCount: Int!
  status: String!
  decision: String
  decidedByUserId: ID
  resolvedCanonicalEntityId: ID
  decidedAt: AWSDateTime
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

enum EntityResolutionDecision {
  link
  create
  defer
  reject
}

"""
Merge impact preview — computed before the merge and echoed back as the
confirmation input; a stale preview aborts the merge.
"""
type CanonicalEntityMergeImpact {
  sourceMappingCount: Int!
  identityClaimCount: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  loserWikiPageId: ID
  loserWikiPageSlug: String
  survivorWikiPageId: ID
}

input CanonicalEntityMergeImpactInput {
  sourceMappingCount: Int!
  identityClaimCount: Int!
  memoryClaimCount: Int!
  graphEntityCount: Int!
  loserWikiPageId: ID
  loserWikiPageSlug: String
  survivorWikiPageId: ID
}

type CanonicalEntityMergeResult {
  survivorId: ID!
  loserId: ID!
  impact: CanonicalEntityMergeImpact!
}

extend type Query {
  canonicalEntities(
    tenantId: ID
    entityTypeSlug: String
    search: String
    status: String
    limit: Int
  ): [CanonicalEntity!]!
  canonicalEntity(tenantId: ID, id: ID!): CanonicalEntity
  entityResolutionCases(
    tenantId: ID
    status: String
    limit: Int
  ): [EntityResolutionCase!]!
  entityResolutionCase(tenantId: ID, caseId: ID!): EntityResolutionCase
  canonicalEntityMergePreview(
    tenantId: ID
    survivorId: ID!
    loserId: ID!
  ): CanonicalEntityMergeImpact!
}

extend type Mutation {
  """
  Apply Link / Create / Defer / Reject to an open resolution case.
  `canonicalEntityId` is required for link; `displayName` optionally names a
  created entity (defaults to the case's display hint). Defer keeps the case
  open and resets its expiry clock. Every decision appends an audit event.
  """
  resolveEntityResolutionCase(
    tenantId: ID
    caseId: ID!
    decision: EntityResolutionDecision!
    canonicalEntityId: ID
    displayName: String
  ): EntityResolutionCase!
  """
  Guarded merge repair: the loser becomes a redirect (status merged) and its
  mappings/claims/graph rows/wiki page repoint or archive onto the survivor.
  `confirmImpact` must echo the preview exactly or the merge aborts.
  """
  mergeCanonicalEntities(
    tenantId: ID
    survivorId: ID!
    loserId: ID!
    confirmImpact: CanonicalEntityMergeImpactInput!
  ): CanonicalEntityMergeResult!
}
