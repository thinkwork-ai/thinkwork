# Resolved Capability Manifest read surface (plan §U15 pt 2/3).
#
# Admin UI reads the last N manifests for a given agent so
# an operator can see exactly what capabilities the session was granted.
# The manifest_json field is opaque AWSJSON — the runtime (U15 pt 2
# Python capture) can evolve the shape without a server-side resolver
# rename.

type RuntimeManifest {
  id: ID!
  sessionId: String!
  tenantId: ID!
  agentId: ID
  userId: ID
  # Turn/context identity (capability-mapping plan U11) — populated by the
  # U12 runtime emitter; null on pre-U11 rows.
  threadId: ID
  threadTurnId: ID
  spaceId: ID
  agentProfileId: ID
  # Resolved-config fingerprint forwarded from the dispatch payload; the
  # inspector's divergence states (R15) compare against this.
  configFingerprint: String
  manifestJson: AWSJSON!
  createdAt: AWSDateTime!
}

extend type Query {
  runtimeManifestsByAgent(
    agentId: ID!
    limit: Int
    # Context-keyed retrieval (U11): each filter is exact-match when set.
    spaceId: ID
    agentProfileId: ID
    threadId: ID
  ): [RuntimeManifest!]!
}
