enum OntologyLifecycleStatus {
  PROPOSED
  APPROVED
  DEPRECATED
  REJECTED
}

enum OntologyMappingKind {
  EXACT
  CLOSE
  BROAD
  NARROW
  RELATED
}

"""
Shared status vocabulary for change sets and their items. DEFERRED is
item-only (an item excluded from an approval that stays re-reviewable,
THINK-320 R15) — passing it as a change-set status is rejected.
"""
enum OntologyChangeSetStatus {
  DRAFT
  PENDING_REVIEW
  APPROVED
  REJECTED
  APPLIED
  DEFERRED
}

"""
What happens to items excluded from a per-item approval (THINK-320 R15):
DEFERRED keeps them re-reviewable; REJECTED fingerprints them so scans
never re-propose the candidate (R13).
"""
enum OntologyExcludedItemDisposition {
  DEFERRED
  REJECTED
}

enum OntologyChangeItemType {
  ENTITY_TYPE
  RELATIONSHIP_TYPE
  FACET_TEMPLATE
  EXTERNAL_MAPPING
}

enum OntologyChangeAction {
  CREATE
  UPDATE
  DEPRECATE
  REJECT
}

enum OntologyJobStatus {
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  CANCELED
}

type OntologyVersion {
  id: ID!
  tenantId: ID!
  versionNumber: Int!
  status: String!
  sourceChangeSetId: ID
  activatedAt: AWSDateTime
  createdAt: AWSDateTime!
}

type OntologyEntityType {
  id: ID!
  tenantId: ID!
  versionId: ID
  slug: String!
  name: String!
  description: String
  broadType: String!
  aliases: [String!]!
  propertiesSchema: AWSJSON!
  """
  Versioned identity rules (THINK-193 U4): array of
  { slug, keyKind, normalization, unique, uniquenessScope,
    sourcePrecedence, autoLink, version }. Rules govern how instances of
  this type resolve to canonical entities; the instances live in the
  identity registry, never in ontology tables.
  """
  identityRules: AWSJSON!
  identityRulesVersion: Int!
  guidanceNotes: String
  lifecycleStatus: OntologyLifecycleStatus!
  approvedAt: AWSDateTime
  deprecatedAt: AWSDateTime
  rejectedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  facetTemplates: [OntologyFacetTemplate!]!
  externalMappings: [OntologyExternalMapping!]!
}

type OntologyRelationshipType {
  id: ID!
  tenantId: ID!
  versionId: ID
  slug: String!
  name: String!
  description: String
  inverseName: String
  sourceEntityTypeId: ID
  targetEntityTypeId: ID
  sourceTypeSlugs: [String!]!
  targetTypeSlugs: [String!]!
  aliases: [String!]!
  guidanceNotes: String
  lifecycleStatus: OntologyLifecycleStatus!
  approvedAt: AWSDateTime
  deprecatedAt: AWSDateTime
  rejectedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  externalMappings: [OntologyExternalMapping!]!
}

type OntologyFacetTemplate {
  id: ID!
  tenantId: ID!
  entityTypeId: ID!
  slug: String!
  heading: String!
  facetType: String!
  position: Int!
  sourcePriority: AWSJSON!
  prompt: String
  guidanceNotes: String
  lifecycleStatus: OntologyLifecycleStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type OntologyExternalMapping {
  id: ID!
  tenantId: ID!
  subjectKind: String!
  subjectId: ID!
  mappingKind: OntologyMappingKind!
  vocabulary: String!
  externalUri: String!
  externalLabel: String
  notes: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type OntologyChangeSet {
  id: ID!
  tenantId: ID!
  title: String!
  summary: String
  status: OntologyChangeSetStatus!
  confidence: Float
  observedFrequency: Int!
  expectedImpact: AWSJSON!
  proposedBy: String!
  proposedByUserId: ID
  approvedByUserId: ID
  approvedAt: AWSDateTime
  rejectedByUserId: ID
  rejectedAt: AWSDateTime
  appliedVersionId: ID
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  items: [OntologyChangeSetItem!]!
  evidenceExamples: [OntologyEvidenceExample!]!
}

type OntologyChangeSetItem {
  id: ID!
  tenantId: ID!
  changeSetId: ID!
  itemType: OntologyChangeItemType!
  action: OntologyChangeAction!
  status: OntologyChangeSetStatus!
  targetKind: String
  targetSlug: String
  title: String!
  description: String
  proposedValue: AWSJSON!
  editedValue: AWSJSON
  confidence: Float
  position: Int!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  evidenceExamples: [OntologyEvidenceExample!]!
}

type OntologyEvidenceExample {
  id: ID!
  tenantId: ID!
  changeSetId: ID!
  itemId: ID
  sourceKind: String!
  sourceRef: String
  sourceLabel: String
  quote: String!
  metadata: AWSJSON!
  observedAt: AWSDateTime
  createdAt: AWSDateTime!
}

type OntologySuggestionScanJob {
  id: ID!
  tenantId: ID!
  status: OntologyJobStatus!
  trigger: String!
  dedupeKey: String
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  error: String
  result: AWSJSON!
  metrics: AWSJSON!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type OntologyReprocessJob {
  id: ID!
  tenantId: ID!
  changeSetId: ID
  ontologyVersionId: ID
  dedupeKey: String
  status: OntologyJobStatus!
  attempt: Int!
  claimedAt: AWSDateTime
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  input: AWSJSON!
  impact: AWSJSON!
  metrics: AWSJSON!
  error: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

"""
Approved entity type projected for the Living Map canvas (THINK-320 U1):
slug/name plus a live count of kg entities carrying the type.
"""
type OntologySchemaGraphType {
  slug: String!
  name: String!
  instanceCount: Int!
  lifecycleStatus: OntologyLifecycleStatus!
}

"""
Approved relationship type projected as a labeled schema-graph edge.
"""
type OntologySchemaGraphRelationship {
  slug: String!
  name: String!
  sourceTypeSlugs: [String!]!
  targetTypeSlugs: [String!]!
}

"""
Pending change-set item surfaced as a ghost candidate on the map. `origin`
is the owning change set's proposedBy (suggestion_engine, user, ...).
"""
type OntologySchemaGraphCandidate {
  itemId: ID!
  changeSetId: ID!
  itemType: OntologyChangeItemType!
  slug: String
  proposedValue: AWSJSON!
  editedValue: AWSJSON
  evidenceCount: Int!
  origin: String!
  status: OntologyChangeSetStatus!
}

type OntologySchemaGraph {
  tenantId: ID!
  types: [OntologySchemaGraphType!]!
  relationships: [OntologySchemaGraphRelationship!]!
  candidates: [OntologySchemaGraphCandidate!]!
}

type OntologyDefinitions {
  tenantId: ID!
  activeVersion: OntologyVersion
  entityTypes: [OntologyEntityType!]!
  relationshipTypes: [OntologyRelationshipType!]!
  facetTemplates: [OntologyFacetTemplate!]!
  externalMappings: [OntologyExternalMapping!]!
}

input StartOntologySuggestionScanInput {
  tenantId: ID!
  trigger: String = "manual"
  dedupeKey: String
}

input UpdateOntologyChangeSetItemInput {
  id: ID!
  status: OntologyChangeSetStatus
  editedValue: AWSJSON
  """
  Optimistic concurrency guard (THINK-320 R16): the item's updatedAt as
  loaded by the client. If the item changed since, the mutation fails with
  a conflict instead of overwriting; omit to skip the check.
  """
  expectedUpdatedAt: AWSDateTime
}

input UpdateOntologyChangeSetInput {
  tenantId: ID!
  changeSetId: ID!
  title: String
  summary: String
  status: OntologyChangeSetStatus
  items: [UpdateOntologyChangeSetItemInput!]
}

input ApproveOntologyChangeSetInput {
  tenantId: ID!
  changeSetId: ID!
  """
  Per-item approval (THINK-320 R15): items to leave out of this approval.
  Excluded items get the excludedDisposition status instead of approved.
  """
  excludedItemIds: [ID!]
  excludedDisposition: OntologyExcludedItemDisposition = DEFERRED
}

input OntologyChangeSetItemEvidenceInput {
  sourceKind: String!
  sourceRef: String
  sourceLabel: String
  quote: String!
  metadata: AWSJSON
  observedAt: AWSDateTime
}

input CreateOntologyChangeSetItemInput {
  itemType: OntologyChangeItemType!
  action: OntologyChangeAction = CREATE
  slug: String!
  title: String
  description: String
  proposedValue: AWSJSON!
  confidence: Float
  evidence: [OntologyChangeSetItemEvidenceInput!]
}

"""
Manual authoring entry point (THINK-320 U2, KTD-5): creates or appends to
the caller's open manual draft change set. Each item runs the R14
slug-collision check server-side — colliding pending slugs merge into the
existing item, colliding approved slugs come back as conflicts.
"""
input CreateOntologyChangeSetInput {
  tenantId: ID!
  title: String
  summary: String
  items: [CreateOntologyChangeSetItemInput!]!
}

"""
R14 collision that could not be staged: the slug already exists as an
approved definition, so no duplicate row was created.
"""
type OntologyChangeSetSlugConflict {
  slug: String!
  itemType: OntologyChangeItemType!
  reason: String!
}

type CreateOntologyChangeSetPayload {
  """
  Null when every submitted item merged into other pending items or
  conflicted with approved definitions (no draft was created or touched).
  """
  changeSet: OntologyChangeSet
  """
  Items whose slug matched an existing pending item — evidence was
  unioned onto that item and its proposal updated in place.
  """
  mergedItemIds: [ID!]!
  conflicts: [OntologyChangeSetSlugConflict!]!
}

input RejectOntologyChangeSetInput {
  tenantId: ID!
  changeSetId: ID!
  reason: String
}

input UpdateOntologyEntityTypeInput {
  tenantId: ID!
  entityTypeId: ID!
  name: String
  description: String
  broadType: String
  aliases: [String!]
  guidanceNotes: String
  lifecycleStatus: OntologyLifecycleStatus
}

input UpdateOntologyRelationshipTypeInput {
  tenantId: ID!
  relationshipTypeId: ID!
  name: String
  description: String
  inverseName: String
  sourceTypeSlugs: [String!]
  targetTypeSlugs: [String!]
  aliases: [String!]
  guidanceNotes: String
  lifecycleStatus: OntologyLifecycleStatus
}

extend type Query {
  ontologyDefinitions(tenantId: ID!): OntologyDefinitions!
  """
  Living Map feed (THINK-320 U1): approved types with live instance
  counts, approved relationships, and pending candidate items.
  """
  ontologySchemaGraph(tenantId: ID!): OntologySchemaGraph!
  ontologyChangeSets(
    tenantId: ID!
    status: OntologyChangeSetStatus
  ): [OntologyChangeSet!]!
  ontologySuggestionScanJob(
    tenantId: ID!
    jobId: ID!
  ): OntologySuggestionScanJob
  ontologyReprocessJob(tenantId: ID!, jobId: ID!): OntologyReprocessJob
}

extend type Mutation {
  startOntologySuggestionScan(
    input: StartOntologySuggestionScanInput!
  ): OntologySuggestionScanJob!
  createOntologyChangeSet(
    input: CreateOntologyChangeSetInput!
  ): CreateOntologyChangeSetPayload!
  updateOntologyChangeSet(
    input: UpdateOntologyChangeSetInput!
  ): OntologyChangeSet!
  approveOntologyChangeSet(
    input: ApproveOntologyChangeSetInput!
  ): OntologyChangeSet!
  rejectOntologyChangeSet(
    input: RejectOntologyChangeSetInput!
  ): OntologyChangeSet!
  updateOntologyEntityType(
    input: UpdateOntologyEntityTypeInput!
  ): OntologyEntityType!
  updateOntologyRelationshipType(
    input: UpdateOntologyRelationshipTypeInput!
  ): OntologyRelationshipType!
  """
  Replace an entity type's identity rules (THINK-193 U4). Bumps
  identityRulesVersion. Tenant-admin gated.
  """
  setOntologyEntityTypeIdentityRules(
    tenantId: ID
    entityTypeId: ID!
    rules: AWSJSON!
  ): OntologyEntityType!
}
