# First-class workflow control-plane API.
#
# The Workflow types are the product-facing inventory and run ledger. Existing
# Routine types remain available as Step Functions engine evidence and
# compatibility detail.

enum WorkflowLifecycleStatus {
  draft
  active
  deprecated
  archived
}

enum WorkflowVisibility {
  agent_private
  tenant_shared
}

enum WorkflowTriggerFamily {
  manual
  schedule
  webhook
  crm
  n8n
  api
  agent
  child_workflow
}

enum WorkflowReadinessState {
  unknown
  ready
  blocked_not_ready
  disabled
}

enum WorkflowVersionStatus {
  draft
  active
  superseded
  archived
}

enum WorkflowBindingType {
  step_functions_routine
  step_functions_interpreter
  n8n_bridge
  n8n_import
  twenty_crm
  connected_app
  native
}

enum WorkflowBindingStatus {
  configured
  ready
  blocked_not_ready
  disabled
  archived
}

enum WorkflowRunStatus {
  queued
  running
  waiting_for_human
  succeeded
  failed
  canceled
  timed_out
  blocked_not_ready
}

enum WorkflowEventProvenance {
  native_event
  app_callback
  engine_history
  output_inferred
  operator_decision
}

enum WorkflowEvidenceRedactionState {
  summary_only
  redacted
  offloaded
  raw_allowed
}

"""
Workflow inventory read scope. USER preserves normal visibility rules.
OPERATOR includes every owner's private workflows and requires tenant-admin
authorization on the server.
"""
enum WorkflowReadScope {
  USER
  OPERATOR
}

type Workflow {
  id: ID!
  tenantId: ID!
  name: String!
  slug: String!
  description: String
  lifecycleStatus: WorkflowLifecycleStatus!
  visibility: WorkflowVisibility!
  ownerUserId: ID
  ownerAgentId: ID
  # Source Automation for save-time-converged report workflows. Generic,
  # imported, CRM, and routine-backed workflows leave this null.
  sourceAgentLoopId: ID
  sourceAutomation: AgentLoop
  primaryTriggerFamily: WorkflowTriggerFamily!
  currentVersionId: ID
  currentVersionNumber: Int
  currentVersion: WorkflowVersion
  capabilityFlags: AWSJSON!
  readinessState: WorkflowReadinessState!
  readinessReasons: AWSJSON!
  triggers: [WorkflowTrigger!]!
  bindings: [WorkflowEngineBinding!]!
  lastRunId: ID
  lastRun: WorkflowRun
  lastRunAt: AWSDateTime
  runs(limit: Int, cursor: String, status: WorkflowRunStatus): [WorkflowRun!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type WorkflowVersion {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  workflow: Workflow
  versionNumber: Int!
  versionStatus: WorkflowVersionStatus!
  sourceKind: String!
  sourceMetadata: AWSJSON!
  definitionSnapshot: AWSJSON!
  capabilitySnapshot: AWSJSON!
  routineAslVersionId: ID
  routineAslVersion: RoutineAslVersion
  createdByActorType: String
  createdByActorId: ID
  publishedAt: AWSDateTime
  createdAt: AWSDateTime!
}

type WorkflowTrigger {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  workflow: Workflow
  workflowVersionId: ID
  workflowVersion: WorkflowVersion
  triggerFamily: WorkflowTriggerFamily!
  sourceSystem: String
  enabled: Boolean!
  idempotencyRequired: Boolean!
  triggerConfig: AWSJSON!
  actorContract: AWSJSON!
  readinessState: WorkflowReadinessState!
  readinessReasons: AWSJSON!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type WorkflowEngineBinding {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  workflow: Workflow
  workflowVersionId: ID
  workflowVersion: WorkflowVersion
  bindingType: WorkflowBindingType!
  bindingStatus: WorkflowBindingStatus!
  routineId: ID
  routine: Routine
  routineAslVersionId: ID
  routineAslVersion: RoutineAslVersion
  pluginInstallId: ID
  managedApplicationId: ID
  externalWorkflowId: String
  externalWorkflowName: String
  externalVersionId: String
  connectionRef: AWSJSON!
  capabilityFlags: AWSJSON!
  readinessState: WorkflowReadinessState!
  readinessReasons: AWSJSON!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type WorkflowRun {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  workflow: Workflow
  workflowVersionId: ID
  workflowVersion: WorkflowVersion
  engineBindingId: ID
  engineBinding: WorkflowEngineBinding
  status: WorkflowRunStatus!
  triggerFamily: WorkflowTriggerFamily!
  triggerSource: String
  actorType: String
  actorId: ID
  idempotencyKey: String
  correlationId: String
  backendExecutionId: String
  backendExecutionRef: AWSJSON!
  capabilitySnapshot: AWSJSON!
  readinessSnapshot: AWSJSON!
  inputSummary: AWSJSON
  outputSummary: AWSJSON
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  lastEventAt: AWSDateTime
  errorCode: String
  errorMessage: String
  totalCostUsdCents: Int
  events: [WorkflowRunEvent!]!
  evidence: [WorkflowEvidence!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type WorkflowRunEvent {
  id: ID!
  tenantId: ID!
  workflowRunId: ID!
  workflowRun: WorkflowRun
  eventType: String!
  eventStatus: String
  provenance: WorkflowEventProvenance!
  occurredAt: AWSDateTime!
  message: String
  payloadSummary: AWSJSON!
  evidenceRef: AWSJSON!
  createdAt: AWSDateTime!
}

type WorkflowEvidence {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  workflow: Workflow
  workflowRunId: ID
  workflowRun: WorkflowRun
  evidenceType: String!
  sourceSystem: String!
  sourceId: String
  uri: String
  summary: AWSJSON!
  redactionState: WorkflowEvidenceRedactionState!
  sensitivity: String
  retentionExpiresAt: AWSDateTime
  createdAt: AWSDateTime!
}

input TriggerWorkflowRunInput {
  workflowId: ID!
  input: AWSJSON
  idempotencyKey: String
  triggerSource: String
  actorType: String
  actorId: ID
  agentId: ID
}

extend type Query {
  workflows(
    tenantId: ID
    scope: WorkflowReadScope = USER
    lifecycleStatus: WorkflowLifecycleStatus
    readinessState: WorkflowReadinessState
    limit: Int
    cursor: String
  ): [Workflow!]!
  workflow(id: ID!, scope: WorkflowReadScope = USER): Workflow
  workflowRuns(
    tenantId: ID
    scope: WorkflowReadScope = USER
    workflowId: ID
    status: WorkflowRunStatus
    limit: Int
    cursor: String
  ): [WorkflowRun!]!
  workflowRun(id: ID!, scope: WorkflowReadScope = USER): WorkflowRun
}

"""
Definition validation error in ThinkWork terms (THINK-214 R4) — step, field,
reason. Never ASL vocabulary.
"""
type WorkflowDefinitionError {
  stepId: String
  field: String!
  reason: String!
}

input WorkflowScheduleTriggerInput {
  """
  EventBridge Scheduler expression: rate(...) or cron(...).
  """
  scheduleExpression: String!
  timezone: String
  enabled: Boolean
}

input SaveWorkflowTriggerInput {
  """
  manual | schedule | webhook
  """
  family: String!
  schedule: WorkflowScheduleTriggerInput
}

input SaveWorkflowInput {
  """
  Update when present; create otherwise.
  """
  id: ID
  name: String
  description: String
  """
  The versioned workflow definition document (typed steps + optional continuation policy).
  """
  definition: AWSJSON
  trigger: SaveWorkflowTriggerInput
  enabled: Boolean
}

"""
Validation failures return errors with workflow null — form-friendly, never a
GraphQL throw for definition problems.
"""
type SaveWorkflowResult {
  workflow: Workflow
  errors: [WorkflowDefinitionError!]!
  """
  Present when the workflow has a webhook trigger — the caller-facing URL path (/webhooks/<token>).
  """
  webhookToken: String
}

"""
Approved-plan narrowing override (THINK-193 U3): applies only to memory
workflow plan-review approvals. Server-side validated to only NARROW the
saved processor configuration — sources must already be configured, caps
must not exceed saved boundaries. Ignored on deny.
"""
input WorkflowApprovalOverrideInput {
  sourceConfigIds: [ID!]
  focusKeys: [String!]
  timeRangeFrom: AWSDateTime
  timeRangeTo: AWSDateTime
  maxRecords: Int
}

extend type Mutation {
  saveWorkflow(input: SaveWorkflowInput!): SaveWorkflowResult!
  deleteWorkflow(id: ID!): ID!
  triggerWorkflowRun(input: TriggerWorkflowRunInput!): WorkflowRun!
  resolveWorkflowApproval(
    runId: ID!
    approve: Boolean!
    note: String
    override: WorkflowApprovalOverrideInput
  ): WorkflowRun!
}
