  workflowCapabilityFlags: AWSJSON!
}

type ManagedApplicationDeploymentChange {
  key: String!
  action: String!
  desiredEnabled: Boolean!
  provisioned: Boolean!
  runtimeEnabled: Boolean!
  workflowUrl: String!
  message: String!
}

type ManagedApplicationMcpRegistration {
  key: String!
  serverId: ID
  installed: Boolean!
  status: String!
  message: String!
}

type ManagedApplicationHealthCheck {
  key: String!
  healthy: Boolean!
  statusCode: Int
  latencyMs: Int!
  endpoint: String
