  clusterArn: String
  serviceName: String
  serviceNames: [String!]!
  albArn: String
  targetGroupArn: String
  storageBucketName: String
  databaseName: String
  message: String
  managedMcpServerId: ID
  managedMcpStatus: String!
  managedMcpInstalled: Boolean!
  managedMcpInstallAvailable: Boolean!
