  releaseVersion: String
  releaseManifestUrl: String
  releaseManifestSha256: String
  deploymentControllerArn: String
  deploymentRunnerProjectName: String
  deploymentEvidenceBucket: String
  bucketName: String
  databaseEndpoint: String
  ecrUrl: String
  adminUrl: String
  docsUrl: String
  apiEndpoint: String
  appsyncUrl: String
  appsyncRealtimeUrl: String
  hindsightEndpoint: String
  agentcoreStatus: String
  hindsightEnabled: Boolean!
  managedMemoryEnabled: Boolean!
  twentyProvisioned: Boolean!
  twentyRuntimeEnabled: Boolean!
  twentyUrl: String
  twentyClusterArn: String
  twentyServerServiceName: String
  twentyWorkerServiceName: String
  twentyServerLogGroupName: String
  twentyWorkerLogGroupName: String
  twentyAlbArn: String
  twentyTargetGroupArn: String
