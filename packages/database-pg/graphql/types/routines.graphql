# --- Inputs ---

# Phase B U7 cutover: CreateRoutineInput now carries the ASL + markdown
# summary + step manifest the chat builder + publish flow emit. The
# legacy type/schedule/config triple was removed because the new resolver
# provisions a real Step Functions state machine via the ASL document
# instead of the legacy in-row config blob. Schedules attach to a routine
# via setRoutineTrigger after creation; routine type is derived from the
# routine's triggers, not stored on the routines row.
input CreateRoutineInput {
  tenantId: ID!
  agentId: ID
  # Visibility model (schema follow-up bundle). Defaults to agent_private
  # when owningAgentId is set, tenant_shared otherwise. The MCP
  # create_routine tool stamps owningAgentId = caller agent id; the
  # admin/mobile new-routine page lets users leave both blank to mint
  # a tenant-shared routine.
  visibility: RoutineVisibility
  owningAgentId: ID
  name: String!
  description: String
  # Optional explicit artifacts for chat/agent authoring paths that
  # already generated ASL. If omitted, createRoutine attempts the
  # server-side authoring MVP from the description/intent and rejects
  # unsupported intents before creating AWS resources.
  asl: AWSJSON
  markdownSummary: String
  stepManifest: AWSJSON
}

input PlanRoutineDraftInput {
  tenantId: ID!
  name: String!
  description: String
  steps: [RoutineDefinitionStepConfigInput!]
}

# Phase B U7: ASL changes go through publishRoutineVersion. updateRoutine
# narrows to non-ASL metadata edits. `type` is the legacy
# routines.type column (heartbeat | scheduled | cron) still consulted
# by job-triggers; the canonical trigger surface is routine_triggers,
# but the column survives through Phase D's UI cutover.
input UpdateRoutineInput {
  name: String
  description: String
  type: String
  status: String
  schedule: String
  agentId: ID
}

input RoutineTriggerInput {
  triggerType: String!
  config: AWSJSON
  enabled: Boolean
}

# Phase B U7 will land the resolver. Schema present in Phase A so codegen
# carries the type signature into all consumers ahead of the resolver.
input PublishRoutineVersionInput {
  routineId: ID!
  asl: AWSJSON!
  markdownSummary: String!
  stepManifest: AWSJSON!
}

input RebuildRoutineVersionInput {
  routineId: ID!
}

input RoutineDefinitionStepConfigInput {
  nodeId: String!
  recipeId: String
  label: String
  args: AWSJSON!
}

input RoutineDefinitionGraphNodeInput {
  nodeId: String!
  recipeId: String
  label: String
  args: AWSJSON
  kind: String
}

input RoutineDefinitionGraphEdgeInput {
  source: String!
  target: String!
  kind: String!
  condition: AWSJSON
  label: String
}

input RoutineDefinitionGraphInput {
  nodes: [RoutineDefinitionGraphNodeInput!]!
  edges: [RoutineDefinitionGraphEdgeInput!]!
  startNodeId: String
}

input UpdateRoutineDefinitionInput {
  routineId: ID!
  steps: [RoutineDefinitionStepConfigInput!]!
  graph: RoutineDefinitionGraphInput
}

input DecideRoutineApprovalInput {
  inboxItemId: ID!
  decision: AWSJSON!
}

# --- git_python routine source (deterministic routines v1) ---

# One file read from the routine's GitHub repo.
type RoutineSourceFile {
  path: String!
  content: String!
  # Coarse language hint for the editor: python | json | typescript | text.
  language: String!
}

# The module + fixture files backing a git_python routine, read at `ref`.
type RoutineSource {
  routineId: ID!
  # The commit sha or branch the files were read at (validated sha when set).
  ref: String!
  files: [RoutineSourceFile!]!
}

# --- Routine promotion proposals (THINK-280 U6) ---

# An immutable, non-executable Routine promotion proposal. Approval binds
# to exactly one payloadFingerprint (R14/AE6). Creation and edits touch
# neither Git nor execution — any edit is a NEW proposal with a NEW
# fingerprint that supersedes the prior one.
type CapabilityRoutineProposal {
  id: ID!
  tenantId: ID!
  # Target Routine when promoting an update; null for a new Routine.
  routineId: ID
  # The whole immutable bundle: normalized code, typed input/output,
  # sanitized fixtures, invariants, exact dependency refs, minimum grants,
  # principal spec, effect/data/cost summary, and broker/turn evidence.
  payload: AWSJSON!
  # RFC 8785 + SHA-256 fingerprint — approval consumes exactly this.
  payloadFingerprint: String!
  # Source broker call / turn evidence references.
  evidenceRefs: AWSJSON!
  # draft | submitted | approved | rejected | superseded | promoted
  status: String!
  # operator | repair — repair is the sole machine-approved exception.
  approvalMode: String
  # Structured-field diff + hermetic fixture evidence (repair) or the
  # promotion verdict (operator). Distinguishes operator- from
  # repair-approved SHAs.
  approvalEvidence: AWSJSON
  # Link to the human decision item; the Inbox owns the decision.
  inboxItemId: ID
  createdByActorType: String
  createdByActorId: ID
  decidedAt: AWSDateTime
  # Null for repair (machine-approved); set for operator approvals.
  decidedByUserId: ID
  # Git commit SHA written by promotion; null until promoted.
  promotedCommitSha: String
  createdAt: AWSDateTime!
}

input CreateRoutineProposalInput {
  tenantId: ID!
  # Existing Routine when updating; omit for a new Routine.
  routineId: ID
  # The immutable proposal bundle (code normalized + fixtures sanitized
  # server-side before persistence + fingerprint).
  bundle: AWSJSON!
  # draft (default) | submitted (ready for operator review).
  status: String
}

input ApproveRoutineProposalInput {
  tenantId: ID!
  proposalId: ID!
  # The exact fingerprint the operator reviewed. A mismatch (payload changed
  # since review) rejects the approval — approvals are single-use and exact.
  reviewedFingerprint: String!
}

type RoutineProposalMutationResult {
  # applied | rejected
  outcome: String!
  # Safe, operator-readable reason when rejected.
  reason: String
  proposal: CapabilityRoutineProposal
  # Promotion summary (present on approve):
  # promoted | validation_failed | commit_conflict | error
  promotionOutcome: String
  promotedCommitSha: String
  validatedSha: String
  # Hermetic fixture-gate detail for the promoted SHA.
  hermetic: AWSJSON
}

# --- Query / Mutation extensions ---

extend type Query {
  routines(tenantId: ID!, agentId: ID, status: RoutineStatus): [Routine!]!
  routine(id: ID!): Routine
  # Phase A schema; resolvers ship in Phase B (U7+U9) and Phase A (U4).
  routineExecution(id: ID!): RoutineExecution
  routineExecutions(
    routineId: ID!
    status: RoutineExecutionStatus
    limit: Int
    cursor: String
  ): [RoutineExecution!]!
  routineStepEvents(executionId: ID!): [RoutineStepEvent!]!
  routineRepairEvents(routineId: ID!, limit: Int): [RoutineRepairEvent!]!
  routineAslVersion(id: ID!): RoutineAslVersion
  routineDefinition(routineId: ID!): RoutineDefinition
  routineRecipeCatalog(tenantId: ID!): [RoutineRecipe!]!
  tenantToolInventory(tenantId: ID!): TenantToolInventory!
  # Deterministic routines v1 — read the git_python routine's source files
  # (module + fixtures) from the connected GitHub repo, at the validated
  # commit when present (else the repo branch HEAD), so the web app can show
  # the code in-app. Operator-gated; GitHub is read live via the stored
  # routine-repo credential.
  routineSource(routineId: ID!): RoutineSource!

  # THINK-280 U6 — Routine promotion proposals.
  routineProposal(id: ID!): CapabilityRoutineProposal
  routineProposals(
    tenantId: ID!
    routineId: ID
    status: String
  ): [CapabilityRoutineProposal!]!
}

extend type Mutation {
  planRoutineDraft(input: PlanRoutineDraftInput!): RoutineDraft!
  createRoutine(input: CreateRoutineInput!): Routine!
  updateRoutine(id: ID!, input: UpdateRoutineInput!): Routine!
  deleteRoutine(id: ID!): Boolean!
  # Phase B U7 cutover: returns RoutineExecution! (the row pre-emptively
  # inserted into routine_executions). Optional `input` is forwarded as
  # the SFN execution input. The legacy RoutineRun! return shape was
  # backed by a never-populated routine_runs table.
  triggerRoutineRun(routineId: ID!, input: AWSJSON): RoutineExecution!

  setRoutineTrigger(
    routineId: ID!
    input: RoutineTriggerInput!
  ): RoutineTrigger!
  deleteRoutineTrigger(id: ID!): Boolean!

  # Phase A schema; resolvers ship in Phase B (U7) and Phase B (U8).
  publishRoutineVersion(input: PublishRoutineVersionInput!): RoutineAslVersion!
  rebuildRoutineVersion(input: RebuildRoutineVersionInput!): RoutineAslVersion!
  updateRoutineDefinition(
    input: UpdateRoutineDefinitionInput!
  ): RoutineDefinition!
  decideRoutineApproval(input: DecideRoutineApprovalInput!): InboxItem!

  # THINK-280 U6 — Routine promotion proposals. Creation is side-effect-free
  # (no Git, no execution). Approval is exact + single-use and triggers the
  # atomic bundle commit + hermetic validation.
  createRoutineProposal(
    input: CreateRoutineProposalInput!
  ): RoutineProposalMutationResult!
  approveRoutineProposal(
    input: ApproveRoutineProposalInput!
  ): RoutineProposalMutationResult!
  rejectRoutineProposal(
    tenantId: ID!
    proposalId: ID!
    reason: String
  ): RoutineProposalMutationResult!
}
