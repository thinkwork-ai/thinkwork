# Routine domain types: Routine, RoutineRun, RoutineStep,
# RoutineTrigger and related enums/inputs.
#
# Step Functions migration: as of plan 2026-05-01-004 (Routines Phase A),
# Routine carries an `engine` partition + Step-Functions-specific fields,
# and three new types (RoutineExecution / RoutineStepEvent /
# RoutineAslVersion) back the Step Functions runtime. RoutineRun and
# RoutineStep are deprecated; they remain shipping through Phase D and
# are removed in Phase E (U15).

enum RoutineStatus {
  ACTIVE
  PAUSED
  ARCHIVED
}

enum RoutineRunStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

enum RoutineEngine {
  LEGACY_PYTHON
  STEP_FUNCTIONS
  GIT_PYTHON
}

enum RoutineExecutionStatus {
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
  AWAITING_APPROVAL
  TIMED_OUT
  # THINK-280 U7: governed capability-headless outcomes. BLOCKED — preflight
  # readiness failed closed (contract drift, config fingerprint mismatch, stale
  # approval, or a missing/revoked service binding) and no provider session was
  # ever opened. DEGRADED — the run proceeded on a degraded (but not revoked)
  # binding and is attributable but reduced. These are distinguished from
  # FAILED by icon + label on the run surfaces, not by color alone.
  BLOCKED
  DEGRADED
}

# Routine visibility model (schema follow-up bundle).
# Lower-snake values match the literals already baked into
# admin-ops/checkRoutineVisibility — keeping the enum lower-snake
# avoids a translation layer between the SQL CHECK constraint, the
# GraphQL enum, and the MCP tool's runtime check.
enum RoutineVisibility {
  agent_private
  tenant_shared
}

type Routine {
  id: ID!
  tenantId: ID!
  agentId: ID
  agent: Agent
  name: String!
  description: String
  type: String!
  status: String!
  schedule: String
  config: AWSJSON
  # Step Functions migration partition: legacy_python | step_functions.
  # legacy_python rows pre-date Phase A; step_functions rows are the new
  # ASL-backed shape.
  engine: String!
  # Step Functions resource ARNs. Null on legacy_python routines.
  stateMachineArn: String
  stateMachineAliasArn: String
  # Agent-authored markdown summary, regenerated on every publish.
  documentationMd: String
  # Pointer to the latest published version_number in routine_asl_versions.
  currentVersion: Int
  # Visibility model (schema follow-up bundle). Splits the conflated
  # agentId — agentId is the primary execution agent, owningAgentId is
  # the agent that authored / has stewardship. routine_invoke MCP tool
  # enforces ownership via these two fields.
  visibility: RoutineVisibility!
  owningAgentId: ID
  # ---- git_python engine fields (deterministic routines v1) ----
  # Null on legacy_python / step_functions routines. Code lives only in the
  # tenant-configured GitHub repo; these are identity + pointers, never code.
  # Path of the Python module inside the tenant repo.
  modulePath: String
  # Repo paths of the routine's recorded fixture files (JSON string[]).
  fixturePaths: AWSJSON
  # Tenant-credential ids this routine declares; only these are injected
  # into its sandbox session at execution (R19).
  credentialRefs: AWSJSON
  # Last fixture-validated commit SHA (denormalized from routine_code_cache).
  validatedSha: String
  # Set when the repair budget circuit-breaker (or an operator) disabled
  # the routine.
  disabledReason: String
  lastRunAt: AWSDateTime
  nextRunAt: AWSDateTime
  # Nullable in Phase A while the type-resolver lands in Phase B U7. A
  # non-null list with no resolver null-propagates and breaks the parent
  # routine query for any client that selects it.
  executions: [RoutineExecution!]
  triggers: [RoutineTrigger!]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type RoutineTrigger {
  id: ID!
  routineId: ID!
  tenantId: ID!
  triggerType: String!
  config: AWSJSON
  enabled: Boolean!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# ---- Step Functions runtime types (Phase A) ----

type RoutineExecution {
  id: ID!
  tenantId: ID!
  routineId: ID!
  routine: Routine
  # Null on git_python executions, which run through the routine-exec-git
  # Lambda instead of Step Functions.
  stateMachineArn: String
  aliasArn: String
  versionArn: String
  sfnExecutionArn: String
  triggerId: ID
  trigger: RoutineTrigger
  triggerSource: String!
  inputJson: AWSJSON
  outputJson: AWSJSON
  status: String!
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  errorCode: String
  errorMessage: String
  totalLlmCostUsdCents: Int
  # ---- git_python engine fields (deterministic routines v1) ----
  # The commit SHA whose code actually executed (R4).
  commitSha: String
  # The routine's validated SHA at execution time — differs from commitSha
  # when the executor reverted to last-validated code.
  validatedSha: String
  # True when git was unreachable and the S3-cached last-validated SHA
  # served the run (R6).
  cacheServed: Boolean
  # ---- THINK-280 U7: governed capability-headless execution evidence ----
  # The resolved execution principal decision for this run:
  # { mode: 'requester'|'agent_owner'|'service', subjectId?, bindingId? }. NULL
  # on legacy user run-as runs (never inferred or fallen back across modes).
  executionPrincipal: AWSJSON
  # Exact resolved dependency manifest checked at preflight:
  # [{ twcap, contractHash, definitionVersionId }]. NULL on non-capability runs.
  capabilityDependencies: AWSJSON
  # Resolved-config / manifest fingerprint validated at preflight against the
  # pinned dependency snapshot (R15). NULL on non-capability runs.
  configFingerprint: String
  # Preflight readiness verdict: 'ready' | 'blocked' | 'degraded'. Only 'ready'
  # opens a broker session; blocked/degraded record a terminal run with
  # remediation and ZERO provider work (AE2/AE8). NULL on non-capability runs.
  readinessOutcome: String
  # Operator-readable remediation for a blocked/degraded run:
  # { kind, detail, servicePrincipalId?, bindingId?, definitionVersionId? }.
  # Rendered adjacent to the run outcome. NULL when the run needed none.
  remediation: AWSJSON
  # The minted broker-session evidence row id (capability_broker_sessions.id)
  # for this run. NULL when no session was opened (blocked runs, legacy runs).
  brokerSessionId: ID
  # Append-only broker-call evidence for this run (bounded provider/platform
  # operations dispatched under the minted session), newest first. Empty on
  # non-capability runs. Joined from capability_broker_calls by execution id.
  brokerCalls: [CapabilityBrokerCall!]!
  stepEvents: [RoutineStepEvent!]!
  # Pointer to the routine_asl_versions row that backed this specific
  # execution. Resolved by (state_machine_arn, version_arn) — the same
  # pair PublishStateMachineVersion stamps onto each version. Run-detail
  # consumes `aslVersion.stepManifestJson` so the graph renders even
  # before any step events arrive. Null for executions whose version
  # ARN wasn't recorded (out-of-band SFN starts).
  aslVersion: RoutineAslVersion
  createdAt: AWSDateTime!
}

type RoutineStepEvent {
  id: ID!
  tenantId: ID!
  executionId: ID!
  nodeId: String!
  recipeType: String!
  status: String!
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  inputJson: AWSJSON
  outputJson: AWSJSON
  errorJson: AWSJSON
  llmCostUsdCents: Int
  retryCount: Int!
  stdoutS3Uri: String
  stderrS3Uri: String
  stdoutPreview: String
  truncated: Boolean!
  # THINK-280 U7: when this step dispatched a governed provider/platform
  # operation, the append-only broker-call evidence row id; and for a durable
  # Artifact effect, the produced artifact id. Both NULL on ordinary recipe
  # steps.
  brokerCallId: ID
  artifactId: ID
  createdAt: AWSDateTime!
}

# THINK-280 U7: append-only broker-call evidence (capability_broker_calls),
# projected for the execution-detail UI. Never carries secret material or
# unbounded provider bodies — only bounded digests + policy/budget/effect
# metadata and durable output references.
type CapabilityBrokerCall {
  id: ID!
  tenantId: ID!
  brokerSessionId: ID!
  clientRequestId: String!
  sequence: Int
  # Exact twcap operation reference (e.g. "twcap:<ns>/connection/github-rest@1#issues.list").
  operationRef: String
  contractHash: String
  definitionVersionId: ID
  bindingId: ID
  # rejected | authorized | completed | accepted | failed | indeterminate
  status: String!
  effect: String
  errorCategory: String
  adapterKind: String
  durationMs: Int
  requestDigest: String
  resultDigest: String
  budgetDelta: AWSJSON
  # Durable output reference when the result exceeded the inline cap:
  # { kind: 'artifact'|'s3', ref }.
  durableRef: AWSJSON
  routineExecutionId: ID
  threadTurnId: ID
  authorizedAt: AWSDateTime
  finalizedAt: AWSDateTime
  createdAt: AWSDateTime!
}

# Repair-ladder history for git_python routines (deterministic routines
# v1). Backs the visible repair log (R12/R15). Schema lands with U1;
# writer + read resolver ship with the repair units (U7/U8).
type RoutineRepairEvent {
  id: ID!
  tenantId: ID!
  routineId: ID!
  executionId: ID
  # retry | revert | repair_attempt | pending_commit | disabled | infra_failure
  eventType: String!
  # Thread / wakeup ref that carried the agent repair; null for mechanical tiers.
  threadRef: String
  fromSha: String
  toSha: String
  # green | red (repair_attempt events)
  gateResult: String
  # in_envelope | out_of_envelope (agent commits)
  envelopeVerdict: String
  # Repair attempts remaining for the UTC day after this event.
  budgetSnapshot: Int
  detailJson: AWSJSON
  createdAt: AWSDateTime!
}

type RoutineAslVersion {
  id: ID!
  tenantId: ID!
  routineId: ID!
  versionNumber: Int!
  stateMachineArn: String!
  versionArn: String!
  aliasWasPointing: String
  aslJson: AWSJSON!
  markdownSummary: String!
  stepManifestJson: AWSJSON!
  validationWarningsJson: AWSJSON
  publishedByActorId: ID
  publishedByActorType: String
  createdAt: AWSDateTime!
}

